<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the paper run under the notch; the safe-area insets
     below keep the actual controls clear of it -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7edd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Before Dinner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Home Before Dinner — The Town</title>
<style>
  :root{
    --bg:#f7edd8; --panel:#fff8ea; --line:#e6d8bd; --ink:#3a332c;
    --muted:#8a7d6a; --accent:#e05e10; --good:#2e9e63;
    --glow:rgba(224,94,16,.25);
    --paper:#fbf3df; --road:#b6ab97; --road2:#d2c8b3; --rail:#a68d72;
    --card:rgba(0,0,0,.05); --seg:rgba(0,0,0,.1); --sharebg:rgba(0,0,0,.05);
    --dash:#ffdf7e; --dis-bg:#ece1cb; --dis-ink:#a3947e;
  }
  /* Night falls on the map alone: it dims, vines come through, spores drift
     and the sun goes out. The UI stays in daylight throughout. */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 "Comic Sans MS","Chalkboard SE","Marker Felt","Comic Neue","Segoe Print",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    transition:background .6s,color .6s;
    /* iOS: no blue flash on tap, no long-press callout, no text inflation,
       and no rubber-banding the whole page */
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }
  /* dvh follows Safari's shrinking toolbar; vh stays as the fallback */
  body{height:100vh}
  @supports (height:100dvh){ body{height:100dvh} }
  header{
    padding:10px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:10px; flex:0 0 auto; position:relative; z-index:5;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
  }
  header h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.5px;white-space:nowrap}
  header h1 span{color:var(--accent);text-shadow:0 0 12px var(--glow)}
  header .date{
    color:var(--muted);font-size:12px;margin-left:10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* the pace toggle: how fast the evening runs */
  #paceCtl{
    margin-left:auto;display:flex;gap:2px;align-self:center;
    border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card);
  }
  .pace{
    width:auto;min-height:26px;padding:2px 9px;font-size:11.5px;font-weight:600;
    background:transparent;color:var(--muted);border-radius:999px;box-shadow:none;
  }
  .pace.on{background:var(--accent);color:#fff}
  @media (max-width:480px){ .pace .lbl{display:none} .pace{padding:2px 7px} }
  /* a narrow phone must not wrap the title onto a second line */
  @media (max-width:410px){
    header{padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
    header h1{font-size:15px}
    header .date{font-size:10.5px}
  }

  /* The map gets 70% of the screen, but never so much that the panel has no
     room to work on a short landscape screen. */
  #mapWrap{
    flex:0 0 auto;position:relative;background:var(--paper);transition:background .6s;
    height:min(55vh,calc(100vh - 250px));
  }
  /* the notch and the home indicator come out of the map's share, so the
     buttons below never get squeezed off the bottom of the screen */
  @supports (height:100dvh){
    #mapWrap{
      height:min(55dvh,calc(100dvh - 250px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    }
  }
  /* touch-action:none turns off the browser's own double-tap zoom, so the
     map gets the double-tap instead */
  svg#map{width:100%;height:100%;display:block;touch-action:none;user-select:none}
  #zoomOut{
    position:absolute;right:10px;bottom:10px;width:auto;z-index:6;
    padding:7px 12px;font-size:13px;border-radius:8px;opacity:0;pointer-events:none;
    min-height:44px;touch-action:manipulation;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.12);transition:opacity .2s;
  }
  #zoomOut.show{opacity:1;pointer-events:auto}
  .zbtn{
    position:absolute;right:10px;width:44px;height:44px;z-index:6;padding:0;
    font-size:20px;line-height:1;border-radius:8px;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  #admin{
    position:absolute;left:12px;top:12px;z-index:8;width:296px;display:none;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.18);font-size:12px;
  }
  body.admin #admin{display:block}
  #admin .ahead{font-weight:700;margin-bottom:6px}
  #admin .arow{display:flex;gap:8px;align-items:center;margin-bottom:8px;color:var(--muted)}
  #admin .abtn{
    width:auto;flex:1 1 0;min-height:34px;padding:6px 10px;font-size:12.5px;border-radius:8px;
    background:var(--accent);color:#fff;box-shadow:none;
  }
  #admin .abtn.ghosty{background:transparent;color:var(--muted);border:1px solid var(--line)}
  #admin textarea{
    width:100%;height:104px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line);border-radius:8px;padding:6px;resize:vertical;
    background:rgba(0,0,0,.04);color:var(--ink);
  }
  #admin .warn{color:#c0392b;font-weight:700}
  #admin .ok{color:#2e9e63;font-weight:700}
  body.admin .loc{cursor:grab}
  body.admin .loc.dragging{cursor:grabbing}
  #zin{bottom:114px}
  #zminus{bottom:62px}
  /* night coming down over the town, from half seven onwards */
  #dusk{
    position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;
    transition:opacity .4s linear;
    background:linear-gradient(180deg,rgba(46,34,86,.62),rgba(10,12,34,.74));
  }
  header .date.late{color:#8f1626;font-weight:700}
  #haze{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;z-index:4}
  .spore{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(190,26,48,.8);box-shadow:0 0 6px 2px rgba(220,50,70,.45);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translate3d(0,110%,0) scale(.6);opacity:0}
    12%{opacity:.9} 88%{opacity:.7}
    100%{transform:translate3d(24px,-15%,0) scale(1.15);opacity:0}
  }

  /* --- the map itself --- */
  .street{stroke:var(--road);stroke-linecap:round;fill:none}
  .street.major{stroke-width:13}
  .street.minor{stroke:var(--road2);stroke-width:7}
  .rail{stroke:var(--rail);stroke-width:3;stroke-dasharray:9 7;fill:none}
  .streetname{fill:var(--muted);font-size:13px;opacity:.8;font-family:inherit}
  .green-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:.3}
  .cline{stroke:var(--dash);stroke-width:3;stroke-dasharray:15 11;stroke-linecap:round;fill:none}
  /* every block of town coloured in with its own crayon */
  .b0{fill:#ffeaa7}.b1{fill:#ffd6de}.b2{fill:#c9edcb}.b3{fill:#cbe7f8}
  .b4{fill:#ffdfba}.b5{fill:#e4daf8}.b6{fill:#dcf2b0}.b7{fill:#ffe3d2}
  .b8{fill:#b7e6a6}
  /* vines draw themselves on as the night comes down */
  .vine{
    fill:none;stroke:#8f1626;stroke-linecap:round;stroke-linejoin:round;opacity:.9;
    stroke-dashoffset:var(--len);transition:stroke-dashoffset 1s ease-out;
  }
  .vine.alt{stroke:#ab2136}
  .vine.grown{stroke-dashoffset:0}
  .bud{
    fill:#8f1626;opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;
    transition:opacity .45s .55s ease-out,transform .45s .55s ease-out;
  }
  .bud.grown{opacity:.9;transform:scale(1)}
  .sun-disc{fill:#ffd43b;stroke:#f2a71b;stroke-width:2.5}
  .sun-ray{stroke:#f2a71b;stroke-width:4;stroke-linecap:round}
  .sun-eye{fill:#8a5a00}
  .sun-mouth{fill:none;stroke:#8a5a00;stroke-width:2.5;stroke-linecap:round}
  /* the sun goes out as the light goes */
  .sun-disc,.sun-ray{transition:fill .8s,stroke .8s}
  body.night .sun-disc{fill:#3b3556;stroke:#2b2740}
  body.night .sun-ray{stroke:#2b2740}
  body.night .sun-eye,body.night .sun-mouth{display:none}

  .loc{cursor:pointer}
  .loc .halo{fill:transparent}
  .loc .dot{fill:var(--panel);stroke:var(--muted);stroke-width:2;transition:stroke .2s,fill .2s}
  .loc .label{
    fill:var(--ink);font-size:15.5px;font-weight:600;text-anchor:middle;
    paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;
    font-family:inherit;pointer-events:none;
  }
  .loc .pic{font-size:29px;text-anchor:middle;pointer-events:none}
  /* markers idle with a gentle bob; hover grows them a fifth. The two live on
     nested groups so the transforms never fight over one element. */
  /* the visuals never take the pointer — the halo is the one true tap target */
  .marker{transform-box:fill-box;transform-origin:center;transition:transform .18s ease-out;pointer-events:none}
  .bob{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
  .loc.spent .bob{animation:none}
  .loc.sel .marker{transform:scale(1.18)}
  @media (hover:hover){
    .loc:not(.town):not(.spent):hover .marker{transform:scale(1.2)}
  }
  /* desktop: bigger markers to match the bigger map; hover stays +20% */
  @media (min-width:820px){
    .marker{transform:scale(1.15)}
    .loc.sel .marker{transform:scale(1.32)}
    .loc:not(.town):not(.spent):hover .marker{transform:scale(1.38)}
  }
  .loc:hover .dot{stroke:var(--accent)}
  .loc.sel .dot{stroke:var(--accent);fill:var(--accent);stroke-width:3}
  .loc.sel .label{fill:var(--accent)}
  .loc.spent{opacity:.34}
  .loc.spent .dot{stroke-dasharray:3 3}
  .loc.hit .dot{stroke:var(--good);fill:var(--good)}
  .loc.town{cursor:default}
  .loc.town .dot{stroke:var(--accent);stroke-width:3}
  .loc.town .label{fill:var(--accent);font-size:18px;letter-spacing:.5px}
  .gate{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  /* the clue light: a flashlight beam and a ring, lit as their clues unlock */
  .beam{fill:url(#beamGrad);filter:url(#soften);opacity:0;transition:opacity .8s ease-out;pointer-events:none}
  .ring{fill:none;stroke:#ffcf4a;opacity:0;transition:opacity .8s ease-out;pointer-events:none;
        filter:url(#soften);mix-blend-mode:multiply}
  .hints.lit2 .beam{opacity:1}
  .hints.lit3 .ring{opacity:.5}
  body.night .beam{opacity:0}
  body.night .hints.lit2 .beam{opacity:1;filter:url(#soften) brightness(1.5)}
  /* the kid on the swing — a whole one */
  .kid{stroke:#3a332c;stroke-width:2.6;stroke-linecap:round;fill:none}
  .kid-head{fill:#f6c98a;stroke:#3a332c;stroke-width:2}
  .seat{stroke:#7a5c3a;stroke-width:4;stroke-linecap:round}
  /* the freight */
  .tengine{fill:#8f3f3a}
  .tstack{fill:#5f4038}
  .twheel{fill:#4a4038;stroke:#2f2823;stroke-width:1}
  .tcar{stroke:#00000022;stroke-width:1}
  /* places that are built rather than lettered */
  .art{pointer-events:none}
  .shadow{fill:rgba(0,0,0,.12)}
  .art :is(polygon,rect,ellipse,path,circle):not(.shadow){
    stroke-linejoin:round;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.22));
  }
  .blab{font-family:inherit;font-weight:700;letter-spacing:.5px}
  .strut{stroke:#7e93a6;stroke-width:2.5;stroke-linecap:round}
  .lamppost{stroke:#6a6156;stroke-width:2.5;stroke-linecap:round;fill:none}
  .lamphead{fill:#dfd7c6;stroke:#6a6156;stroke-width:1}
  .lampglow{fill:#ffd769;opacity:0;transition:opacity 1.2s}
  body.lamps .lampglow{opacity:.6}
  body.lamps .lamphead{fill:#ffe9a4}
  /* --- life around the town --- */
  .lake{fill:#a4d9f2}
  .scene{font-family:inherit;text-anchor:middle;pointer-events:none;user-select:none}
  .pline{stroke:#8a6f4d;stroke-width:5;stroke-linecap:round;fill:none}
  .chain{stroke:#8a6f4d;stroke-width:3;stroke-linecap:round}
  .slide{stroke:#d0873f;stroke-width:7;stroke-linecap:round}
  .swing-arm{transform-box:fill-box;transform-origin:top center;animation:sway 2.4s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
  .pball{animation:bounce 1.7s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
  /* the cyclist and the freight are script-driven so a pass can start from
     either side; only the night fade lives in CSS */
  /* by nightfall the kids and the cyclist have gone home; the freight has not */
  .swing-arm,.pball,.rider{transition:opacity 1.5s}
  body.night .swing-arm,body.night .pball,body.night .rider{opacity:0}
  @media (prefers-reduced-motion:reduce){
    .bob,.swing-arm,.pball,.gate{animation:none}
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  /* --- panel --- */
  .panel{
    flex:1 1 auto;min-height:0;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 14px;position:relative;z-index:5;display:flex;flex-direction:column;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
  }
  /* Clues scroll; the buttons stay put, so the guess is always in reach. */
  .panel-scroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  /* both actions on one row, the guess taking the lion's share */
  .panel-foot{flex:0 0 auto;padding-top:8px;display:flex;gap:8px;align-items:stretch}
  .panel-foot #guessBtn{flex:2.4 1 0}
  .panel-foot #resetBtn{flex:1 1 0}
  .panel-foot button{
    width:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .status{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .status .pill{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:2px 9px;font-size:11.5px;color:var(--muted);white-space:nowrap
  }
  .status .pill b{color:var(--ink)}
  .banner{
    border:1px solid var(--accent);background:rgba(255,45,63,.09);
    border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13.5px;
    box-shadow:0 0 22px -6px var(--glow);
  }
  .banner b{color:var(--accent)}
  /* the missing poster */
  /* one line, so the clue below it still fits on a small phone */
  .poster{
    display:inline-flex;align-items:baseline;gap:7px;
    background:#fffdf4;border:2px dashed #4a4238;border-radius:4px;
    padding:2px 10px 3px;transform:rotate(-1.5deg);
    box-shadow:2px 2px 0 rgba(0,0,0,.1);
  }
  .poster .p-top{font-size:9px;letter-spacing:1.5px;color:var(--muted);white-space:nowrap}
  .poster .p-name{font-size:14px;font-weight:700;line-height:1.15;white-space:nowrap}

  .warmth{margin:0 0 8px}
  .warmth:empty{display:none}          /* no bar, no gap, before the first guess */
  .warmth .cap{
    display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px;
  }
  .warmth .cap b{color:var(--accent);letter-spacing:0}
  .bar{display:flex;gap:4px}
  .seg{
    flex:1 1 0;height:12px;border-radius:2px;background:var(--seg);
    transition:background .3s;
  }
  .seg.on{background:var(--accent)}
  .clue{
    border-left:3px solid var(--accent);background:var(--card);
    padding:7px 12px;margin:0 0 6px;border-radius:0 6px 6px 0;
  }
  /* the clue number rides inline with the text — a whole line saved */
  .clue .n{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-right:6px}
  .clue p{margin:0;font-size:14px;line-height:1.4}
  .guess-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;
  }
  .guess-row .dist{color:var(--muted);font-variant-numeric:tabular-nums}
  .guess-row .arrow{font-size:18px}
  button{
    font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;
    background:var(--accent);color:#fff;cursor:pointer;width:100%;
    min-height:44px;touch-action:manipulation;   /* Apple's minimum tap target */
  }
  button:disabled{background:var(--dis-bg);color:var(--dis-ink);cursor:not-allowed}
  button.ghost{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    padding:6px 10px;min-height:44px;font-size:13.5px;
  }
  button.ghost:hover{color:var(--accent);border-color:var(--accent)}
  .hint{color:var(--muted);font-size:11.5px;text-align:center;margin:6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* --- desktop: the map fills the whole window and the panel floats over it,
     clues top-right and buttons bottom-left, so nothing takes space from the
     town. --header-h is measured in JS, since the header grows with the
     safe-area inset. --- */
  @media (min-width:820px){
    body{position:relative}
    #mapWrap{flex:1 1 auto;height:auto;min-height:0}
    .panel{
      position:absolute;left:0;right:0;bottom:0;top:var(--header-h,56px);
      background:none;border-top:0;padding:0;display:block;pointer-events:none;z-index:7;
    }
    .panel-scroll{
      position:absolute;top:18px;right:18px;width:360px;max-height:calc(100% - 36px);
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.16);
      pointer-events:auto;
    }
    .panel-foot{
      position:absolute;left:18px;bottom:18px;width:330px;
      display:flex;flex-direction:column;gap:8px;
      padding:0;border:0;pointer-events:auto;
    }
    .panel-foot #guessBtn,.panel-foot #resetBtn{
      flex:0 0 auto;width:100%;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.18);
    }
    .panel-foot #resetBtn{background:var(--panel)}
    .hint{text-align:left}
  }
  .result{text-align:center;padding:4px 0 10px}
  .result h2{margin:0 0 4px;font-size:20px;font-weight:700}
  .result .who{color:var(--accent)}
  .share{
    white-space:pre-wrap;background:var(--sharebg);border:1px solid var(--line);
    border-radius:8px;padding:10px;margin:10px 0;font-size:14px;text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>HOME BEFORE <span>DINNER</span></h1>
  <div id="paceCtl" role="group" aria-label="Clock speed">
    <button id="paceSlow" class="pace">🐢<span class="lbl"> Slow</span></button>
    <button id="paceFast" class="pace on">🐇<span class="lbl"> Fast</span></button>
  </div>
  <span class="date" id="clock">5:00 PM</span>
</header>

<div id="mapWrap">
  <!-- cropped to the drawn area: the town fills the frame instead of floating in margin -->
  <svg id="map" viewBox="48 48 904 904" preserveAspectRatio="xMidYMid meet" aria-label="Map of The Town"></svg>
  <div id="dusk"></div>
  <div id="haze"></div>
  <div id="admin">
    <div class="ahead">&#128296; Admin &mdash; drag any place to move it</div>
    <div class="arow"><span id="aOverlap">checking&hellip;</span></div>
    <div class="arow">
      <button id="aCopy" class="abtn">Copy map</button>
      <button id="aReset" class="abtn ghosty">Reset</button>
    </div>
    <textarea id="aOut" readonly spellcheck="false"></textarea>
  </div>
  <button id="zin" class="zbtn" aria-label="Zoom in">+</button>
  <button id="zminus" class="zbtn" aria-label="Zoom out">−</button>
  <button id="zoomOut">⤢ Whole town</button>
</div>

<div class="panel" id="panel">
  <div class="panel-scroll">
    <div class="status">
      <span class="pill">Guesses left <b id="left">5</b></span>
      <div class="poster" id="targetPill">Hunting…</div>
    </div>
    <div id="banner"></div>
    <div class="warmth" id="warmth"></div>
    <div id="clues"></div>
    <div id="guesses"></div>
    <div id="endBox"></div>
    <p class="hint" id="hint">Pinch or double-tap the map to zoom · drag to move</p>
  </div>
  <div class="panel-foot">
    <button id="guessBtn" disabled>Pick a place on the map</button>
    <button id="resetBtn" class="ghost">🔄 New hunt</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- the town ---------- */

  // One block = 100 units. The Town sits dead centre at 500,500.

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function hash(str){
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function mulberry32(a){
    return function(){
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- geometry, measured in blocks ---------- */

  const blocksBetween = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) / BLOCK;

  // SVG y grows downward, so north is -y.
  function bearing(from, to){
    return (Math.atan2(to.x - from.x, from.y - to.y) * 180 / Math.PI + 360) % 360;
  }

  const octant = deg => Math.round(deg / 45) % 8;

  /* ---------- puzzle ---------- */

  const key = todayKey();
  // The Town is the reference point, never the hiding place.
  const HIDEABLE = PLACES.filter(function(p){ return p.id !== 'town'; });

  // Round 0 is the daily everyone shares. "New hunt" walks the rounds forward
  // from there, so the seed stays reproducible instead of going random.
  function puzzleFor(round){
    const rnd = mulberry32(hash('findr::town::' + key + (round ? '#' + round : '')));
    return {
      cast:  CAST[Math.floor(rnd() * CAST.length)],
      place: HIDEABLE[Math.floor(rnd() * HIDEABLE.length)]
    };
  }

  let round = 0, puzzle, MAX_GUESSES, trueBearing, trueBlocks;

  function setRound(r){
    round = r;
    puzzle = puzzleFor(r);
    // Vecna takes a guess off you just by being the one you are hunting.
    MAX_GUESSES = puzzle.cast.boss ? 4 : 5;
    trueBearing = bearing(TOWN, puzzle.place);
    trueBlocks  = blocksBetween(TOWN, puzzle.place);
  }

  // Walk forward to the next round that changes both the person and the place,
  // so a reset never feels like it did nothing.
  function nextRound(){
    const wasCast = puzzle.cast.name, wasPlace = puzzle.place.id;
    for (let r = round + 1; r <= round + 60; r++){
      const cand = puzzleFor(r);
      if (cand.cast.name !== wasCast && cand.place.id !== wasPlace) return r;
    }
    return round + 1;   // unreachable in practice, but never loop forever
  }

  // "3.5 blocks from the green" meant nothing to anyone. Directions are now a
  // landmark everyone can see plus a beam of light drawn on the map; distances
  // are a walk time plus a glowing ring. One block is about a two-minute walk.
  const walkMin = b => Math.max(1, Math.round(b * 2));

  // the farthest place out in the same direction — "they went that way"
  function beaconFor(deg){
    const oct = octant(deg);
    let best = null, bestD = -1;
    HIDEABLE.forEach(function(p){
      if (p.id === puzzle.place.id) return;
      if (octant(bearing(TOWN, p)) !== oct) return;
      const d = blocksBetween(TOWN, p);
      if (d > bestD){ bestD = d; best = p; }
    });
    return best;
  }

  function clueList(){
    const lo = Math.floor(trueBlocks * 2) / 2;
    const bcn = beaconFor(trueBearing);
    const dir = bcn ? 'out the <b>' + bcn.pic + ' ' + bcn.name + '</b> way'
                    : 'toward the <b>' + COMPASS[octant(trueBearing)] + '</b> edge of town';
    const mins = lo === 0 ? 'barely a <b>minute\u2019s walk</b>'
               : 'a <b>' + (lo * 2) + ' to ' + ((lo + 0.5) * 2) + ' minute walk</b>';
    return [
      puzzle.cast.flavor,
      'They went ' + dir + ' — follow the beam of light on the map.',
      'It is ' + mins + ' from The Town — search along the glowing ring.',
      'They picked it because <b>' + puzzle.place.hint + '</b>.'
    ];
  }

  /* ---------- state ---------- */

  let selected = null, guesses = [], done = false;
  const el = id => document.getElementById(id);
  const svg = el('map');
  const SVGNS = 'http://www.w3.org/2000/svg';

  const saveKey  = () => 'findr::town::' + key + (round ? '#' + round : '');
  const ROUND_KEY = 'findr::town::round::' + key;

  function save(){
    try {
      localStorage.setItem(saveKey(), JSON.stringify({ guesses, done }));
      localStorage.setItem(ROUND_KEY, String(round));
    } catch(e){ /* private mode — just don't persist */ }
  }
  function load(){
    try { return JSON.parse(localStorage.getItem(saveKey()) || 'null'); }
    catch(e){ return null; }
  }
  function loadRound(){
    try {
      const r = parseInt(localStorage.getItem(ROUND_KEY) || '0', 10);
      return isFinite(r) && r >= 0 ? r : 0;
    } catch(e){ return 0; }
  }

  /* ---------- drawing the map ---------- */

  function node(tag, attrs, text){
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function drawMap(){
    // a touch of turbulence so the ground looks drawn by hand
    const defs = node('defs', {});
    const wob = node('filter', { id:'wobble', x:'-5%', y:'-5%', width:'110%', height:'110%' });
    wob.appendChild(node('feTurbulence', { type:'fractalNoise', baseFrequency:'0.013', numOctaves:'2', seed:'7', result:'n' }));
    wob.appendChild(node('feDisplacementMap', { in:'SourceGraphic', in2:'n', scale:'7' }));
    defs.appendChild(wob);
    const glow = node('radialGradient', { id:'beamGrad', gradientUnits:'userSpaceOnUse', cx:TOWN.x, cy:TOWN.y, r:700 });
    [['0%','#ffd76a','0.5'], ['55%','#ffce4d','0.26'], ['100%','#f7bd35','0.07']].forEach(function(st){
      glow.appendChild(node('stop', { offset:st[0], 'stop-color':st[1], 'stop-opacity':st[2] }));
    });
    defs.appendChild(glow);
    const soften = node('filter', { id:'soften', x:'-30%', y:'-30%', width:'160%', height:'160%' });
    soften.appendChild(node('feGaussianBlur', { stdDeviation:'7' }));
    defs.appendChild(soften);
    svg.appendChild(defs);

    // the ground wobbles; labels and markers stay crisp on top of it
    const ground = node('g', { filter:'url(#wobble)' });
    svg.appendChild(ground);

    BLOCKS.forEach(function(b){ ground.appendChild(node('polygon', { points:b.points, class:'blk ' + b.tone })); });
    ground.appendChild(node('polygon', { points:LAKE, class:'lake' }));

    // the railway runs east to west, just above Depot St
    ground.appendChild(node('line', { x1:-700, y1:286, x2:1700, y2:286, class:'rail' }));

    STREETS.forEach(function(s){
      ground.appendChild(node('line', {
        x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, class:'street ' + (s.major ? 'major' : 'minor')
      }));
      if (s.major) ground.appendChild(node('line', { x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, class:'cline' }));
    });

    // a sun for the corner of the drawing (it goes out in the Upside Down)
    const sun = node('g', { class:'sun' });
    sun.appendChild(node('circle', { cx:118, cy:112, r:28, class:'sun-disc' }));
    for (let i = 0; i < 8; i++){
      const a = i * Math.PI / 4;
      sun.appendChild(node('line', {
        x1: 118 + Math.cos(a) * 38, y1: 112 + Math.sin(a) * 38,
        x2: 118 + Math.cos(a) * 52, y2: 112 + Math.sin(a) * 52, class:'sun-ray'
      }));
    }
    sun.appendChild(node('circle', { cx:108, cy:106, r:3, class:'sun-eye' }));
    sun.appendChild(node('circle', { cx:128, cy:106, r:3, class:'sun-eye' }));
    sun.appendChild(node('path', { d:'M106,119 Q118,130 130,119', class:'sun-mouth' }));
    ground.appendChild(sun);

    // the growth sits over the streets but under every label and marker
    {
      const vines = node('g', { filter:'url(#wobble)' });
      VINES.forEach(function(v){
        const path = node('path', { d:v.d, class:'vine' + (v.alt ? ' alt' : ''), 'stroke-width':v.w, 'data-stage':v.stage });
        vines.appendChild(path);
        // dash the path by its own length so it can draw itself on
        const len = path.getTotalLength();
        path.style.setProperty('--len', len);
        path.style.strokeDasharray = len;
      });
      BUDS.forEach(function(b){
        vines.appendChild(node('circle', { cx:b.x, cy:b.y, r:b.r, class:'bud', 'data-stage':b.stage }));
      });
      svg.appendChild(vines);
    }

    // the living layer: crisp (no wobble filter), under the labels and markers
    const live = node('g', { class:'live' });
    TREES.forEach(function(t){
      live.appendChild(node('text', { x:t[0], y:t[1], 'font-size':t[3], class:'scene' }, t[2]));
    });
    // the playground: swing frame, a swinging kid, a slide, a bouncing ball
    live.appendChild(node('line', { x1:1060, y1:762, x2:1180, y2:762, class:'pline' }));
    live.appendChild(node('line', { x1:1060, y1:762, x2:1044, y2:842, class:'pline' }));
    live.appendChild(node('line', { x1:1180, y1:762, x2:1196, y2:842, class:'pline' }));
    const swingAt = node('g', { transform:'translate(1120,764)' });   // pivot on the bar
    const arm = node('g', { class:'swing-arm' });
    // a whole kid, not a floating head: chains, seat, head, body, arms, legs
    arm.appendChild(node('line', { x1:-7, y1:0, x2:-7, y2:44, class:'chain' }));
    arm.appendChild(node('line', { x1:7,  y1:0, x2:7,  y2:44, class:'chain' }));
    arm.appendChild(node('line', { x1:-11, y1:44, x2:11, y2:44, class:'seat' }));
    arm.appendChild(node('circle', { cx:0, cy:19, r:6.5, class:'kid-head' }));
    arm.appendChild(node('line', { x1:0, y1:25, x2:0, y2:43, class:'kid' }));
    arm.appendChild(node('line', { x1:0, y1:30, x2:-7, y2:37, class:'kid' }));
    arm.appendChild(node('line', { x1:0, y1:30, x2:7,  y2:37, class:'kid' }));
    arm.appendChild(node('polyline', { points:'0,43 10,47 9,57',  class:'kid' }));
    arm.appendChild(node('polyline', { points:'0,43 13,45 14,55', class:'kid' }));
    swingAt.appendChild(arm);
    live.appendChild(swingAt);
    live.appendChild(node('line', { x1:1300, y1:792, x2:1362, y2:858, class:'slide' }));
    live.appendChild(node('line', { x1:1300, y1:792, x2:1300, y2:858, class:'pline' }));
    live.appendChild(node('text', { x:1240, y:892, 'font-size':24, class:'scene pball' }, '⚽'));
    live.appendChild(node('text', { x:1210, y:930, class:'streetname', 'text-anchor':'middle' }, 'Playground'));
    // street lamps along the big roads; they come on after eight
    [[302,481],[700,481],[-140,481],[1046,481],[524,714],[556,300]].forEach(function(L){
      const lampG = node('g', { class:'lamp' });
      lampG.appendChild(node('circle', { cx:L[0]+7, cy:L[1]-26, r:14, class:'lampglow' }));
      lampG.appendChild(node('line', { x1:L[0], y1:L[1], x2:L[0], y2:L[1]-24, class:'lamppost' }));
      lampG.appendChild(node('path', { d:'M'+L[0]+','+(L[1]-24)+' Q'+L[0]+','+(L[1]-30)+' '+(L[0]+7)+','+(L[1]-30)+' L'+(L[0]+7)+','+(L[1]-28), class:'lamppost' }));
      lampG.appendChild(node('circle', { cx:L[0]+7, cy:L[1]-26, r:3, class:'lamphead' }));
      live.appendChild(lampG);
    });

    // the cyclist and the freight cross, rest, and return from a random side
    const rider = node('g', { class:'rider' });
    const riderGlyph = node('text', { x:0, y:506, 'font-size':28, class:'scene' }, '🚴');
    rider.appendChild(riderGlyph);
    live.appendChild(rider);

    const train = node('g', { class:'train' });
    const trainBody = node('g', {});
    const RAILY = 286;
    function boxcar(bx, bw, fill){
      trainBody.appendChild(node('rect', { x:bx, y:RAILY-26, width:bw, height:20, rx:2.5, fill:fill, class:'tcar' }));
      trainBody.appendChild(node('circle', { cx:bx+8,    cy:RAILY-3, r:4, class:'twheel' }));
      trainBody.appendChild(node('circle', { cx:bx+bw-8, cy:RAILY-3, r:4, class:'twheel' }));
    }
    trainBody.appendChild(node('rect', { x:0,  y:RAILY-22, width:30, height:16, rx:3, class:'tengine' }));
    trainBody.appendChild(node('rect', { x:26, y:RAILY-32, width:14, height:26, rx:2.5, class:'tengine' }));
    trainBody.appendChild(node('rect', { x:5,  y:RAILY-31, width:6,  height:10, class:'tstack' }));
    trainBody.appendChild(node('circle', { cx:8,  cy:RAILY-3, r:4.5, class:'twheel' }));
    trainBody.appendChild(node('circle', { cx:20, cy:RAILY-3, r:4.5, class:'twheel' }));
    trainBody.appendChild(node('circle', { cx:33, cy:RAILY-3, r:4.5, class:'twheel' }));
    boxcar(44, 34, '#a9746c');
    boxcar(82, 34, '#7f9c6d');
    train.appendChild(trainBody);
    live.appendChild(train);

    // the glyph faces left, and the engine leads left as drawn; flip for east
    movers.forEach(function(m){ m.stop(); });
    movers = [
      mover(rider, { span:[-650, 1650], speed:95, gap:[2, 5], firstDelay:0.8,
        face:function(dir){ riderGlyph.setAttribute('transform', dir === 1 ? 'scale(-1 1)' : ''); } }),
      mover(train, { span:[-850, 1800], speed:125, gap:[4, 8], firstDelay:2.5,
        face:function(dir){ trainBody.setAttribute('transform', dir === 1 ? 'translate(116 0) scale(-1 1)' : ''); } })
    ];
    svg.appendChild(live);

    // clue light: a flashlight beam and a ring, lit as their clues unlock
    const hints = node('g', { class:'hints' });
    const bc = octant(trueBearing) * 45, half = 27, RR = 1000;
    const hxp = (a, r) => (TOWN.x + Math.sin(a * Math.PI / 180) * r).toFixed(1);
    const hyp = (a, r) => (TOWN.y - Math.cos(a * Math.PI / 180) * r).toFixed(1);
    hints.appendChild(node('path', {
      class:'beam',
      d:'M' + TOWN.x + ',' + TOWN.y +
        ' L' + hxp(bc - half, RR) + ',' + hyp(bc - half, RR) +
        ' A' + RR + ' ' + RR + ' 0 0 1 ' + hxp(bc + half, RR) + ',' + hyp(bc + half, RR) + ' Z'
    }));
    const band = Math.floor(trueBlocks * 2) / 2;
    hints.appendChild(node('circle', {
      class:'ring', cx:TOWN.x, cy:TOWN.y, r:(band + 0.25) * 100, 'stroke-width':64
    }));
    svg.appendChild(hints);

    STREETS.forEach(function(s){
      const horiz = Math.abs(s.y2 - s.y1) < Math.abs(s.x2 - s.x1);
      const lx = Math.min(s.x1 + 9, 934);   // keep the Parkway's name inside the crop
      svg.appendChild(node('text', {
        class:'streetname',
        x: horiz ? 84 : lx,
        y: horiz ? s.y1 - 9 : 96,
        transform: horiz ? '' : 'rotate(90 ' + lx + ' 96)'
      }, s.name));
    });

    svg.appendChild(node('circle', { cx:TOWN.x, cy:TOWN.y, r:80, class:'green-ring' }));

    PLACES.forEach(function(p, i){
      const g = node('g', { class:'loc' + (p.id === 'town' ? ' town' : ''), 'data-id':p.id });
      // fat tap target: 46 units is as wide as it goes before the two closest
      // places (the water tower and the station, 96 apart) start overlapping
      g.appendChild(node('circle', { cx:p.x, cy:p.y, r:46, class:'halo' }));
      // marker takes the hover/selection scale; bob idles inside it, so the
      // two transforms never fight over the same element
      const marker = node('g', { class:'marker' });
      const bob = node('g', { class:'bob' });
      bob.style.animationDelay = (-(i * 0.47) % 3.2).toFixed(2) + 's';
      if (BUILDS[p.id]){
        // scaled about its own anchor so a build carries the same weight as
        // the lettered markers beside it
        const art = node('g', { class:'art',
          transform:'translate(' + p.x + ',' + p.y + ') scale(1.4) translate(' + (-p.x) + ',' + (-p.y) + ')' });
        BUILDS[p.id](art, p.x, p.y);
        bob.appendChild(art);
      } else {
        bob.appendChild(node('circle', { cx:p.x, cy:p.y, r:24, class:'dot' }));
        bob.appendChild(node('text',   { x:p.x, y:p.y + 10, class:'pic' }, p.pic));
      }
      marker.appendChild(bob);
      g.appendChild(marker);
      g.appendChild(node('text',   { x:p.x, y:p.y + 46, class:'label' }, p.name));
      g.addEventListener('click', function(){ pick(p.id); });
      if (p.ox === undefined){ p.ox = p.x; p.oy = p.y; }
      placeMarker(p);
      if (ADMIN) adminDraggable(g, p);
      svg.appendChild(g);
    });
  }

  const gfx = id => svg.querySelector('.loc[data-id="' + id + '"]');

  /* ---------- admin: drag the town into shape ----------
     ?admin in the URL turns every place into something you can drag. Moves are
     kept in localStorage for this browser only — the published game always
     shows the committed layout — and Copy map hands the coordinates back. */

  const ADMIN = /[?&]admin\b/.test(location.search);
  const ADMIN_KEY = 'findr::admin::places';
  let adminDragging = null;

  function loadAdminMoves(){
    if (!ADMIN) return;
    try {
      const saved = JSON.parse(localStorage.getItem(ADMIN_KEY) || '{}');
      PLACES.forEach(function(p){
        if (saved[p.id]){ p.x = saved[p.id][0]; p.y = saved[p.id][1]; }
      });
    } catch(e){}
  }

  function saveAdminMoves(){
    const out = {};
    PLACES.forEach(function(p){ out[p.id] = [Math.round(p.x), Math.round(p.y)]; });
    try { localStorage.setItem(ADMIN_KEY, JSON.stringify(out)); } catch(e){}
  }

  // the same rule the map is judged by: markers, labels, and labels on markers
  function adminOverlaps(){
    const rects = PLACES.map(function(p){
      const g = gfx(p.id);
      const art = g.querySelector('.art') || g.querySelector('.dot');
      return { id:p.id, art:art.getBoundingClientRect(), lab:g.querySelector('.label').getBoundingClientRect() };
    });
    const hit = (a, b) => Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left)) *
                          Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
    const bad = [];
    for (let i = 0; i < rects.length; i++){
      for (let j = i + 1; j < rects.length; j++){
        const A = rects[i], B = rects[j];
        if (hit(A.art, B.art) > 4)  bad.push(A.id + ' x ' + B.id);
        if (hit(A.lab, B.lab) > 4)  bad.push(A.id + ' label x ' + B.id + ' label');
        if (hit(A.art, B.lab) > 30) bad.push(B.id + ' label over ' + A.id);
        if (hit(B.art, A.lab) > 30) bad.push(A.id + ' label over ' + B.id);
      }
    }
    return bad;
  }

  function adminReport(){
    if (!ADMIN) return;
    const bad = adminOverlaps();
    const tag = el('aOverlap');
    tag.className = bad.length ? 'warn' : 'ok';
    tag.textContent = bad.length
      ? '\u26a0 ' + bad.length + ' overlap' + (bad.length > 1 ? 's' : '') + ': ' + bad.slice(0, 2).join(', ')
      : '\u2713 nothing overlaps';
    el('aOut').value = PLACES.map(function(p){
      return "{ id:'" + p.id + "', x:" + Math.round(p.x) + ", y:" + Math.round(p.y) + " },";
    }).join('\n');
  }

  // markers are drawn at their original spot and shifted, so a move is one attribute
  function placeMarker(p){
    const g = gfx(p.id);
    if (g) g.setAttribute('transform', 'translate(' + (p.x - p.ox) + ',' + (p.y - p.oy) + ')');
  }

  function adminDraggable(g, p){
    g.addEventListener('pointerdown', function(e){
      e.stopPropagation();                 // the map must not pan underneath
      adminDragging = p;
      g.classList.add('dragging');
      try { g.setPointerCapture(e.pointerId); } catch(err){}
    });
    g.addEventListener('pointermove', function(e){
      if (adminDragging !== p) return;
      const m = toMap(e.clientX, e.clientY);
      p.x = Math.round(m.x);
      p.y = Math.round(m.y);
      placeMarker(p);
      suppressClick = true;                // a drag is not a tap
    });
    function done(e){
      if (adminDragging !== p) return;
      g.classList.remove('dragging');
      try { g.releasePointerCapture(e.pointerId); } catch(err){}
      adminDragging = null;
      saveAdminMoves();
      adminReport();
    }
    g.addEventListener('pointerup', done);
    g.addEventListener('pointercancel', done);
  }

  /* ---------- movers ----------
     A vehicle crosses, rests a few seconds, then comes back from a random
     side. One element per vehicle, so there is only ever one of each. */

  let movers = [];

  function mover(el, opts){
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let stopped = false;
    const park = () => el.setAttribute('transform', 'translate(-3000,0)');
    park();
    function pass(){
      if (stopped) return;
      if (reduced.matches){ setTimeout(pass, 2000); return; }
      const dir  = Math.random() < 0.5 ? 1 : -1;
      const from = dir === 1 ? opts.span[0] : opts.span[1];
      const to   = dir === 1 ? opts.span[1] : opts.span[0];
      opts.face(dir);
      const dur = Math.abs(to - from) / opts.speed * 1000;
      const t0 = performance.now();
      (function step(){
        if (stopped) return;
        const k = Math.min(1, (performance.now() - t0) / dur);
        el.setAttribute('transform', 'translate(' + (from + (to - from) * k) + ',0)');
        if (k < 1) requestAnimationFrame(step);
        else {
          park();
          setTimeout(pass, (opts.gap[0] + Math.random() * (opts.gap[1] - opts.gap[0])) * 1000);
        }
      })();
    }
    setTimeout(pass, opts.firstDelay * 1000);
    return { stop:function(){ stopped = true; park(); } };
  }

  // A drawn marker can only be so fat before neighbours collide — the water
  // tower and the station sit 96 units apart. So a tap that lands near a place
  // counts for it: the nearest one inside this radius wins, which gives big
  // finger-sized targets without any overlapping circles on the map.
  const NEAR = 70;

  function nearestPlace(pt){
    let best = null, bestD = Infinity;
    PLACES.forEach(function(p){
      const d = Math.hypot(p.x - pt.x, p.y - pt.y);
      if (d < bestD){ bestD = d; best = p; }
    });
    return bestD <= NEAR ? best : null;
  }

  /* ---------- zoom: double-tap in, double-tap out, drag to move ----------
     Not pinch. iOS hands two-finger gestures to the browser before the page
     ever sees them, so a pinch zooms Safari's page and never reaches the map.
     A double-tap is a plain tap twice — every browser delivers it. */

  const BASE = { x:48, y:48, w:904, h:904 };
  const MAX_ZOOM = 4;
  const TAP_ZOOM = 2.6;           // how far one double-tap goes in
  // The view is a width and a centre; its height follows the shape of the map
  // area. That way a zoomed-in view fills the box instead of leaving bands of
  // blank paper above and below it.
  let zoomW = BASE.w, viewCx = BASE.x + BASE.w / 2, viewCy = BASE.y + BASE.h / 2;
  const pointers = new Set();
  let panFrom = null, moved = 0, suppressClick = false;
  let lastTapAt = -1e9, lastTapPt = null;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function viewSize(){
    const rect = svg.getBoundingClientRect();
    return { w:zoomW, h:zoomW * (rect.width > 0 ? rect.height / rect.width : 1), rect:rect };
  }

  // How wide the view is when fully zoomed out. On a tall phone that is the
  // width of the town; on a wide laptop the town is limited by its height, so
  // the view has to be wider than the town to show all of it.
  function fullZoomW(){
    const rect = svg.getBoundingClientRect();
    const aspect = rect.width > 0 ? rect.height / rect.width : 1;
    return aspect >= BASE.h / BASE.w ? BASE.w : BASE.h / aspect;
  }

  // On a desktop the clue card floats over the right of the map, so when the
  // town is centred, bias it left by half of what the card covers. Otherwise
  // the places under the card cannot be seen — or tapped.
  function centreShift(v){
    if (window.innerWidth < 820) return 0;
    const card = document.querySelector('.panel-scroll');
    if (!card) return 0;
    const covered = Math.max(0, v.rect.right - card.getBoundingClientRect().left);
    return (covered / 2) * (v.w / v.rect.width);
  }

  function applyView(){
    const v = viewSize();
    // on whichever axis shows more than the whole town, centre it
    viewCx = v.w >= BASE.w ? BASE.x + BASE.w / 2 + centreShift(v)
           : clamp(viewCx, BASE.x + v.w / 2, BASE.x + BASE.w - v.w / 2);
    viewCy = v.h >= BASE.h ? BASE.y + BASE.h / 2
           : clamp(viewCy, BASE.y + v.h / 2, BASE.y + BASE.h - v.h / 2);
    svg.setAttribute('viewBox',
      (viewCx - v.w / 2) + ' ' + (viewCy - v.h / 2) + ' ' + v.w + ' ' + v.h);
    const full = fullZoomW();
    el('zoomOut').classList.toggle('show', zoomW < full - 1);
    el('zin').disabled = zoomW <= BASE.w / MAX_ZOOM + 0.5;
    el('zminus').disabled = zoomW >= full - 0.5;
  }

  function resetView(){
    zoomW = fullZoomW();
    viewCx = BASE.x + BASE.w / 2;
    viewCy = BASE.y + BASE.h / 2;
    applyView();
  }

  // client pixels -> map units; the viewBox matches the box, so this is linear
  function toMap(px, py){
    const v = viewSize();
    return {
      x: viewCx - v.w / 2 + (px - v.rect.left) / v.rect.width  * v.w,
      y: viewCy - v.h / 2 + (py - v.rect.top)  / v.rect.height * v.h
    };
  }

  // zoom by `factor`, leaving the map point under the cursor where it is
  function zoomAt(focus, factor){
    const w = clamp(zoomW / factor, BASE.w / MAX_ZOOM, fullZoomW());
    const k = w / zoomW;
    viewCx = focus.x + (viewCx - focus.x) * k;
    viewCy = focus.y + (viewCy - focus.y) * k;
    zoomW = w;
    applyView();
  }

  function panBy(dxUnits, dyUnits){
    viewCx -= dxUnits;
    viewCy -= dyUnits;
    applyView();
  }

  // the map area changes shape when the phone turns
  function measureHeader(){
    document.documentElement.style.setProperty(
      '--header-h', document.querySelector('header').offsetHeight + 'px');
  }
  measureHeader();

  window.addEventListener('resize', function(){
    measureHeader();
    zoomW = Math.min(zoomW, fullZoomW());
    applyView();
  });

  svg.addEventListener('pointerdown', function(e){
    pointers.add(e.pointerId);
    moved = 0;
    // a fresh gesture starts trusted; a drag or a pinch can revoke that below
    if (pointers.size === 1) suppressClick = false;
    // one finger drags the map; two fingers is a pinch, handled on touch events
    panFrom = pointers.size === 1 ? { x:e.clientX, y:e.clientY } : null;
  });

  /* ---------- pinch, on touch events ----------
     Pointer events cannot call this off: preventDefault on a pointermove does
     not stop Safari running its own page zoom, which is why the pointer-based
     pinch did nothing on an iPhone. preventDefault on a two-finger touchmove
     does, and it is how every map library gets pinch working on iOS. */

  let pinchDist = 0, pinching = false;

  const twoFingerGap = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const twoFingerMid = t => toMap((t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2);

  svg.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      e.preventDefault();
      pinching = true;
      pinchDist = twoFingerGap(e.touches);
      panFrom = null;              // no longer a drag
      suppressClick = true;
    }
  }, { passive:false });

  svg.addEventListener('touchmove', function(e){
    if (!pinching || e.touches.length !== 2) return;
    e.preventDefault();            // this is what keeps the page from zooming
    const d = twoFingerGap(e.touches);
    // fingers this close are not a readable gesture, and dividing by a
    // near-zero gap would fling the zoom across its whole range in one frame
    if (pinchDist > 24 && d > 24) zoomAt(twoFingerMid(e.touches), clamp(d / pinchDist, 0.5, 2));
    pinchDist = d;
    suppressClick = true;
  }, { passive:false });

  function endTouch(e){
    if (e.touches.length < 2){ pinching = false; pinchDist = 0; }
  }
  svg.addEventListener('touchend', endTouch);
  svg.addEventListener('touchcancel', endTouch);

  // Safari raises its own gesture events too; refusing them stops the page zoom
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    svg.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false });
  });

  svg.addEventListener('pointermove', function(e){
    if (!panFrom || pointers.size !== 1) return;
    moved += Math.hypot(e.clientX - panFrom.x, e.clientY - panFrom.y);
    if (zoomW < fullZoomW()){
      const v = viewSize();
      const perPixel = v.w / v.rect.width;
      panBy((e.clientX - panFrom.x) * perPixel, (e.clientY - panFrom.y) * perPixel);
    }
    panFrom = { x:e.clientX, y:e.clientY };
    if (moved > 8) suppressClick = true;
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size === 0) panFrom = null;
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);

  svg.addEventListener('click', function(e){
    // a drag that travelled is not a tap on a place
    if (suppressClick){
      e.stopPropagation();
      e.preventDefault();
      suppressClick = false;
      return;
    }
    // performance.now(), not Date.now() — the clock is stubbed in tests
    const t = performance.now(), pt = { x:e.clientX, y:e.clientY };
    if (t - lastTapAt < 350 && lastTapPt && Math.hypot(pt.x - lastTapPt.x, pt.y - lastTapPt.y) < 32){
      lastTapAt = -1e9;
      if (zoomW < fullZoomW() - 1) resetView();      // second double-tap comes back out
      else zoomAt(toMap(pt.x, pt.y), TAP_ZOOM);      // otherwise zoom toward the tap
    } else {
      lastTapAt = t;
      lastTapPt = pt;
    }
    // a near miss still counts: pick the closest place to where the finger landed
    if (!e.target.closest('.loc')){
      const near = nearestPlace(toMap(pt.x, pt.y));
      if (near) pick(near.id);
    }
  }, true);

  svg.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomAt(toMap(e.clientX, e.clientY), e.deltaY < 0 ? 1.18 : 1 / 1.18);
  }, { passive:false });

  el('zoomOut').onclick = resetView;
  const viewCentre = () => ({ x:viewCx, y:viewCy });
  el('zin').onclick = function(){ zoomAt(viewCentre(), 1.5); };
  el('zminus').onclick = function(){ zoomAt(viewCentre(), 1 / 1.5); };

  function pick(id){
    if (done || id === 'town') return;                             // the green is the ruler, not a hiding place
    if (guesses.some(function(g){ return g.id === id; })) return;   // already searched
    selected = id;
    PLACES.forEach(function(p){ gfx(p.id).classList.toggle('sel', p.id === id); });
    render();
  }

  /* ---------- the Upside Down ---------- */

  // Spores exist from the start but only show once the light goes; tick()
  // fades them in with the dusk.
  function makeSpores(){
    const haze = el('haze');
    haze.innerHTML = '';
    for (let i = 0; i < 16; i++){
      const s = document.createElement('div');
      s.className = 'spore';
      s.style.left = (Math.random() * 100) + '%';
      s.style.animationDuration = (9 + Math.random() * 11) + 's';
      s.style.animationDelay = (-Math.random() * 14) + 's';
      haze.appendChild(s);
    }
  }

  /* ---------- rendering ---------- */

  // Ten blocks, filled by how close the last guess landed. The far corners of
  // the town are about 9 blocks apart, so that is the cold end of the scale.
  const COLD = 9;

  function renderWarmth(){
    const box = el('warmth');
    if (!guesses.length){ box.innerHTML = ''; return; }
    const g = guesses[guesses.length - 1];
    const filled = g.hit ? 10 : Math.min(10, Math.max(1, Math.ceil(10 * (1 - g.blocks / COLD))));
    const word = g.hit ? 'found' : filled >= 9 ? 'boiling' : filled >= 7 ? 'hot'
               : filled >= 5 ? 'warm' : filled >= 3 ? 'cold' : 'freezing';
    let segs = '';
    for (let i = 0; i < 10; i++) segs += '<div class="seg' + (i < filled ? ' on' : '') + '"></div>';
    box.innerHTML = '<div class="cap"><span>' + word + '</span><b>' + filled + '/10</b></div>' +
                    '<div class="bar">' + segs + '</div>';
  }

  /* ---------- the clock ----------
     Tea time to bedtime in one minute. An hour goes by every fifteen seconds:
     out at five, the light starts going at half seven, and whoever is still
     out there at nine is not coming home. */

  const CLOCK_START = 17 * 60;        // 5:00 pm, in minutes
  const DUSK_AT     = 19 * 60 + 30;   // 7:30 pm — the light goes, the vines come
  const NIGHT_AT    = 21 * 60;        // 9:00 pm — time is up
  const PACE = { fast:4, slow:2 };    // minutes per second: an hour per 15s or 30s
  const PACE_KEY = 'findr::pace';

  let minPerSec = PACE.fast, clockFrom = 0, clockTimer = null;

  const clockNow = () => CLOCK_START + (performance.now() - clockFrom) / 1000 * minPerSec;

  // Switching pace mid-hunt keeps the clock where it stands — only the rate
  // from here on changes.
  function setPace(mode, persist){
    const rate = PACE[mode] || PACE.fast;
    if (clockTimer && rate !== minPerSec){
      const held = Math.min(clockNow(), NIGHT_AT);
      minPerSec = rate;
      clockFrom = performance.now() - (held - CLOCK_START) / rate * 1000;
    } else {
      minPerSec = rate;
    }
    el('paceSlow').classList.toggle('on', mode === 'slow');
    el('paceFast').classList.toggle('on', mode !== 'slow');
    if (persist){ try { localStorage.setItem(PACE_KEY, mode); } catch(e){} }
    if (clockTimer) tick();
  }
  const duskAmount = m => clamp((m - DUSK_AT) / (NIGHT_AT - DUSK_AT), 0, 1);

  function fmtClock(mins){
    const t = Math.max(0, Math.floor(mins)), h24 = Math.floor(t / 60) % 24, m = t % 60;
    return (((h24 + 11) % 12) + 1) + ':' + String(m).padStart(2, '0') + (h24 < 12 ? ' AM' : ' PM');
  }

  function tick(){
    const mins = Math.min(clockNow(), NIGHT_AT);
    const dusk = duskAmount(mins);
    el('clock').textContent = fmtClock(mins) + (round ? ' · hunt ' + (round + 1) : '');
    el('clock').classList.toggle('late', dusk > 0);
    document.body.classList.toggle('lamps', mins >= 20 * 60);   // eight o'clock
    el('dusk').style.opacity = dusk;
    el('haze').style.opacity = dusk;
    document.body.classList.toggle('night', dusk > 0.45);
    renderVines(false);
    if (!done && clockNow() >= NIGHT_AT) finish(false, true);
  }

  function startClock(){
    clockFrom = performance.now();
    stopClock();
    clockTimer = setInterval(tick, 250);
    tick();
  }

  function stopClock(){
    if (clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  }

  // The vines come with the dark: nothing before half seven, everything by nine.
  // The reveal opens the gate the rest of the way.
  function renderVines(all){
    const p = duskAmount(clockNow());
    const reached = all ? Infinity : (p <= 0 ? -1 : Math.floor(p * 5));
    svg.querySelectorAll('.vine,.bud').forEach(function(n){
      n.classList.toggle('grown', +n.getAttribute('data-stage') <= reached);
    });
  }

  function render(){
    renderVines(false);
    el('left').textContent = Math.max(0, MAX_GUESSES - guesses.length);
    el('targetPill').innerHTML =
      '<span class="p-top">HAVE YOU SEEN</span>' +
      '<span class="p-name">' + puzzle.cast.pic + ' ' + puzzle.cast.name + '</span>';

    el('banner').innerHTML = puzzle.cast.boss
      ? '<div class="banner">🕰️ <b>Vecna is the quarry.</b> He costs you a guess. You get four.</div>'
      : '';

    renderWarmth();

    const clues = clueList();
    const shown = Math.min(guesses.length + 1, clues.length);
    const hintG = svg.querySelector('.hints');
    if (hintG){
      hintG.classList.toggle('lit2', !done && shown >= 2);
      hintG.classList.toggle('lit3', !done && shown >= 3);
    }
    // newest clue on top, so the one that matters needs no scrolling
    el('clues').innerHTML = clues.slice(0, shown).map(function(c, i){
      return '<div class="clue"><p><span class="n">Clue ' + (i+1) + '</span>' + c + '</p></div>';
    }).reverse().join('');

    el('guesses').innerHTML = guesses.map(function(g){
      const p = byId(g.id);
      return '<div class="guess-row">' +
               '<span>' + p.pic + ' ' + p.name + '</span>' +
               '<span class="dist" style="color:' + (g.hit ? 'var(--good)' : 'var(--muted)') + '">' +
                 (g.hit ? 'found them!' : '\u2248' + walkMin(g.blocks) + ' min away') +
               '</span>' +
               '<span class="arrow">' + (g.hit ? '🎯' : ARROWS[octant(g.bearing)]) + '</span>' +
             '</div>';
    }).join('');

    const btn = el('guessBtn');
    if (done){
      btn.style.display = 'none';
      el('hint').style.display = 'none';
    } else {
      btn.disabled = !selected;
      btn.textContent = selected ? 'Search ' + byId(selected).name : 'Pick a place on the map';
      // the zoom hint has done its job once the hunt is under way
      el('hint').style.display = guesses.length ? 'none' : '';
    }
  }

  function finish(won, ranOut){
    done = true;
    stopClock();
    save();

    const g = gfx(puzzle.place.id);
    g.classList.add('hit');
    g.classList.remove('spent');
    (g.querySelector('.pic') || g.querySelector('.art')).classList.add('gate');
    PLACES.forEach(function(p){ gfx(p.id).classList.remove('sel'); });
    renderVines(true);

    const best = guesses.reduce(function(m, x){ return Math.min(m, x.blocks); }, Infinity);
    const share = '🔦 Home Before Dinner ' + key + '  ' +
      (won ? guesses.length + '/' + MAX_GUESSES : 'X/' + MAX_GUESSES) + '\n' +
      guesses.map(function(x){ return x.hit ? '🎯' : ARROWS[octant(x.bearing)]; }).join('') +
      '\nclosest: ' + (best < 0.05 ? 'right there' : '\u2248' + walkMin(best) + ' min');

    el('endBox').innerHTML =
      '<div class="result">' +
        '<h2>' + (won ? 'Found them.' : ranOut ? 'Nine o&rsquo;clock.' : 'They got away.') + '</h2>' +
        '<p style="margin:0;color:var(--muted)">' + puzzle.cast.pic +
          ' <span class="who">' + puzzle.cast.name + '</span> was hiding at ' +
          puzzle.place.pic + ' <b>' + puzzle.place.name + '</b> — about ' +
          walkMin(trueBlocks) + (walkMin(trueBlocks) === 1 ? ' minute' : ' minutes') + ' from The Town.</p>' +
      '</div>' +
      '<div class="share">' + share + '</div>' +
      '<p class="hint">Someone new misses dinner every day at midnight.</p>';

    const box = document.querySelector('.panel-scroll');
    if (box) box.scrollTo({ top:box.scrollHeight, behavior:'smooth' });
    render();
  }

  function markSpent(g){
    const n = gfx(g.id);
    n.classList.remove('sel');
    n.classList.add('spent');
  }

  function submitGuess(){
    if (done || !selected) return;
    const p = byId(selected);
    const g = {
      id: p.id,
      hit: p.id === puzzle.place.id,
      blocks: blocksBetween(p, puzzle.place),
      bearing: bearing(p, puzzle.place)
    };
    guesses.push(g);
    markSpent(g);
    selected = null;
    save();

    if (g.hit) finish(true);
    else if (guesses.length >= MAX_GUESSES) finish(false);
    else { render(); showNewestClue(); }
  }

  // The newest clue is at the top of the list, so this is just a trip home.
  function showNewestClue(){
    const box = document.querySelector('.panel-scroll');
    if (box) box.scrollTo({ top:0, behavior:'smooth' });
  }

  /* ---------- boot ---------- */

  // Draw a round from scratch: fresh map, fresh theme, fresh panel.
  function startRound(r, resume){
    setRound(r);
    selected = null;
    guesses = [];
    done = false;

    makeSpores();
    svg.textContent = '';
    resetView();
    drawMap();

    el('endBox').innerHTML = '';
    el('guessBtn').style.display = '';
    el('hint').style.display = '';
    el('dusk').style.opacity = 0;
    el('haze').style.opacity = 0;
    document.body.classList.remove('night');
    startClock();

    if (ADMIN) setTimeout(adminReport, 60);

    if (resume){
      const saved = load();
      if (saved && Array.isArray(saved.guesses) && saved.guesses.length){
        guesses = saved.guesses.filter(function(g){ return byId(g.id); });
        guesses.forEach(markSpent);
        const won = guesses.some(function(g){ return g.hit; });
        if (won || guesses.length >= MAX_GUESSES){ finish(won); return; }
      }
    } else {
      save();
    }
    render();
  }

  if (ADMIN){
    document.body.classList.add('admin');
    loadAdminMoves();
    el('aCopy').onclick = function(){
      const txt = el('aOut').value;
      el('aOut').select();
      navigator.clipboard.writeText(txt).then(function(){
        el('aCopy').textContent = 'Copied \u2713';
        setTimeout(function(){ el('aCopy').textContent = 'Copy map'; }, 1400);
      }, function(){
        el('aCopy').textContent = 'Select + copy above';
      });
    };
    el('aReset').onclick = function(){
      try { localStorage.removeItem(ADMIN_KEY); } catch(e){}
      location.reload();
    };
  }

  el('guessBtn').onclick = submitGuess;
  el('resetBtn').onclick = function(){ startRound(nextRound(), false); };
  el('paceSlow').onclick = function(){ setPace('slow', true); };
  el('paceFast').onclick = function(){ setPace('fast', true); };
  try { setPace(localStorage.getItem(PACE_KEY) === 'slow' ? 'slow' : 'fast', false); } catch(e){}

  setRound(loadRound());          // so nextRound() has a puzzle to differ from
  startRound(round, true);        // pick up a hunt already in progress
})();
</script>
</body>
</html>
