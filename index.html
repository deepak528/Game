<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Findr — The Town</title>
<style>
  :root{
    --bg:#101418; --panel:#181e25; --line:#2a333d; --ink:#e8edf2;
    --muted:#95a3b1; --accent:#ffc73a; --good:#3ddc97;
    --glow:rgba(255,199,58,.35);
    --paper:#16202a; --road:#2e3d4a; --road2:#22303c; --grass:#1b3327;
    --water:#16323f; --woods:#172c22; --rail:#3b4a58;
  }
  /* the Upside Down: everything goes cold, red and wrong */
  body.ud{
    --bg:#0a0507; --panel:#150a0d; --line:#3a1a20; --ink:#f0dfe2;
    --muted:#b08b91; --accent:#ff2d3f; --good:#ff2d3f;
    --glow:rgba(255,45,63,.4);
    --paper:#12080a; --road:#3a1c22; --road2:#2a1216; --grass:#2a1218;
    --water:#241016; --woods:#1e0d11; --rail:#4a2028;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    transition:background .6s,color .6s;
  }
  header{
    padding:10px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:10px; flex:0 0 auto; position:relative; z-index:5;
  }
  header h1{font:700 17px/1.2 ui-serif,Georgia,serif;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--accent);text-shadow:0 0 12px var(--glow)}
  /* in the Upside Down even the sign is the wrong way round */
  body.ud header h1{display:inline-block;transform:scaleX(-1);color:var(--accent)}
  header .date{color:var(--muted);font-size:12px;margin-left:auto}

  #mapWrap{flex:1 1 auto;min-height:0;position:relative;background:var(--paper);transition:background .6s}
  svg#map{width:100%;height:100%;display:block;touch-action:manipulation}
  #haze{
    position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;
    background:radial-gradient(ellipse at 50% 45%,rgba(120,0,20,.12),rgba(20,0,6,.66) 80%);
  }
  body.ud #haze{opacity:1}
  .spore{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(255,220,225,.85);box-shadow:0 0 6px 2px rgba(255,90,110,.5);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translate3d(0,110%,0) scale(.6);opacity:0}
    12%{opacity:.9} 88%{opacity:.7}
    100%{transform:translate3d(24px,-15%,0) scale(1.15);opacity:0}
  }

  /* --- the map itself --- */
  .street{stroke:var(--road);stroke-linecap:round;fill:none}
  .street.major{stroke-width:13}
  .street.minor{stroke:var(--road2);stroke-width:7}
  .rail{stroke:var(--rail);stroke-width:3;stroke-dasharray:9 7;fill:none}
  .park{fill:var(--grass)}
  .water{fill:var(--water)}
  .woods{fill:var(--woods)}
  .streetname{fill:var(--muted);font-size:11px;opacity:.55;font-family:ui-sans-serif,system-ui}
  .green-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:.3}

  .loc{cursor:pointer}
  .loc .halo{fill:transparent}
  .loc .dot{fill:var(--panel);stroke:var(--muted);stroke-width:2;transition:stroke .2s,fill .2s}
  .loc .label{
    fill:var(--ink);font-size:13px;font-weight:600;text-anchor:middle;
    paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;
    font-family:ui-sans-serif,system-ui;pointer-events:none;
  }
  .loc .pic{font-size:18px;text-anchor:middle;pointer-events:none}
  .loc:hover .dot{stroke:var(--accent)}
  .loc.sel .dot{stroke:var(--accent);fill:var(--accent);stroke-width:3}
  .loc.sel .label{fill:var(--accent)}
  .loc.spent{opacity:.34}
  .loc.spent .dot{stroke-dasharray:3 3}
  .loc.hit .dot{stroke:var(--good);fill:var(--good)}
  .loc.town{cursor:default}
  .loc.town .dot{stroke:var(--accent);stroke-width:3}
  .loc.town .label{fill:var(--accent);font-size:15px;letter-spacing:.5px}
  .gate{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  /* --- panel --- */
  .panel{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 14px;max-height:46vh;overflow-y:auto;position:relative;z-index:5;
  }
  .status{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .status .pill{
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;font-size:12px;color:var(--muted)
  }
  .status .pill b{color:var(--ink)}
  .banner{
    border:1px solid var(--accent);background:rgba(255,45,63,.09);
    border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13.5px;
    box-shadow:0 0 22px -6px var(--glow);
  }
  .banner b{color:var(--accent)}
  .lights{display:flex;gap:5px;margin:0 0 10px;padding:6px 4px}
  .bulb{
    flex:1 1 0;height:13px;border-radius:50%;background:#232b33;
    border:1px solid rgba(255,255,255,.08);transition:background .35s,box-shadow .35s;
  }
  .bulb.on{animation:flicker 1.4s infinite alternate}
  @keyframes flicker{from{filter:brightness(.72)}to{filter:brightness(1.25)}}
  .clue{
    border-left:3px solid var(--accent);background:rgba(255,255,255,.035);
    padding:8px 12px;margin:0 0 8px;border-radius:0 6px 6px 0;
  }
  .clue .n{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .clue p{margin:2px 0 0}
  .guess-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;
  }
  .guess-row .dist{color:var(--muted);font-variant-numeric:tabular-nums}
  .guess-row .arrow{font-size:18px}
  button{
    font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 16px;
    background:var(--accent);color:#141821;cursor:pointer;width:100%;
  }
  body.ud button{color:#fff}
  button:disabled{background:#2a333d;color:#6c7a88;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12.5px;text-align:center;margin:8px 0 0}
  .result{text-align:center;padding:4px 0 10px}
  .result h2{margin:0 0 4px;font:700 20px/1.3 ui-serif,Georgia,serif}
  .result .who{color:var(--accent)}
  .share{
    white-space:pre-wrap;background:rgba(0,0,0,.35);border:1px solid var(--line);
    border-radius:8px;padding:10px;margin:10px 0;font-size:14px;text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>FIND<span>R</span></h1>
  <span class="date" id="dateLabel"></span>
</header>

<div id="mapWrap">
  <svg id="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="Map of The Town"></svg>
  <div id="haze"></div>
</div>

<div class="panel" id="panel">
  <div class="status">
    <span class="pill">Guesses left <b id="left">5</b></span>
    <span class="pill" id="targetPill">Hunting…</span>
  </div>
  <div id="banner"></div>
  <div class="lights" id="lights"></div>
  <div id="clues"></div>
  <div id="guesses"></div>
  <div id="endBox"></div>
  <button id="guessBtn" disabled>Pick a place on the map</button>
  <p class="hint" id="hint">Tap a location. Everything is measured from The Town.</p>
</div>

<script>
(function(){
  'use strict';

  /* ---------- the town ---------- */

  // One block = 100 units. The Town sits dead centre at 500,500.
  const BLOCK = 100;
  const TOWN = { x: 500, y: 500 };

  const PLACES = [
    { id:'town',    name:'The Town',          pic:'🏛️', x:500, y:500, hint:'the middle of everything' },
    { id:'pizza',   name:"Palermo's Pizza",   pic:'🍕', x:596, y:430, hint:'the whole block smells of oregano after four' },
    { id:'library', name:'Public Library',    pic:'📚', x:400, y:434, hint:'you need a card to get in, and quiet to stay' },
    { id:'middle',  name:'Middle School',     pic:'🎒', x:348, y:646, hint:'the bell still rings at 2:40, even in summer' },
    { id:'high',    name:'High School',       pic:'🏫', x:672, y:672, hint:'the field lights come on Friday nights' },
    { id:'tower',   name:'Water Tower',       pic:'🗼', x:500, y:342, hint:'you can see the whole grid from the catwalk' },
    { id:'diner',   name:'The Grand Diner',   pic:'🥤', x:634, y:556, hint:'it is open late and the jukebox eats quarters' },
    { id:'arcade',  name:'Quarter Palace',    pic:'👾', x:544, y:610, hint:'it is loud, and nobody looks up from the cabinets' },
    { id:'lanes',   name:'Lucky Strike',      pic:'🎳', x:752, y:462, hint:'nobody there notices one more pair of rented shoes' },
    { id:'station', name:'Train Station',     pic:'🚂', x:500, y:246, hint:'the freight goes through hard enough to rattle windows' },
    { id:'bowl',    name:'The Old Bowl',      pic:'⛰️', x:266, y:314, hint:'the town gave up on that quarry and the kids did not' },
    { id:'pool',    name:'Community Pool',    pic:'🏊', x:316, y:768, hint:'it is closed for the season and the fence is easy enough' },
    { id:'field',   name:'Baseball Field',    pic:'⚾', x:720, y:806, hint:'the dugout stays dry when nothing else does' },
    { id:'sparks',  name:'Sparks Radio',      pic:'📻', x:652, y:350, hint:'it is the only place in town selling a decent antenna' },
    { id:'grove',   name:'Old Grove',         pic:'🪦', x:232, y:518, hint:'the oldest stones there predate the parkway' },
    { id:'smithy',  name:"Smithy's Hardware", pic:'🔧', x:448, y:588, hint:'if a thing in this town is broken, the part is there' },
    { id:'woods',   name:'The Pines',         pic:'🌲', x:820, y:232, hint:'the trees swallow a flashlight ten feet in' },
    { id:'trailer', name:'Cherry Lane',       pic:'🚐', x:826, y:640, hint:'the walls are thin and everyone hears everything' }
  ];

  const byId = id => PLACES.filter(function(p){ return p.id === id; })[0];

  // Roads are drawn from data, so the town stays easy to redraw.
  const STREETS = [
    { name:'Broadway',    major:true,  x1:500, y1:60,  x2:500, y2:940 },
    { name:'Central Ave', major:true,  x1:60,  y1:500, x2:940, y2:500 },
    { name:'Grove St',    major:false, x1:240, y1:120, x2:240, y2:880 },
    { name:'Cherry Ln',   major:false, x1:760, y1:120, x2:760, y2:880 },
    { name:'School St',   major:false, x1:120, y1:660, x2:880, y2:660 },
    { name:'Depot St',    major:false, x1:120, y1:340, x2:880, y2:340 },
    { name:'The Parkway', major:true,  x1:944, y1:80,  x2:664, y2:944 }
  ];

  const AREAS = [
    { cls:'park',  points:'454,454 546,454 546,546 454,546' },          // the green
    { cls:'woods', points:'706,140 944,118 944,320 768,318 692,238' },  // the pines
    { cls:'park',  points:'178,238 362,218 382,398 198,418' },          // the old bowl
    { cls:'water', points:'238,782 342,758 402,830 320,892 240,862' },  // the pond
    { cls:'park',  points:'640,742 838,752 848,904 652,894' }           // ball fields
  ];

  /* ---------- cast ---------- */

  const CAST = [
    { name:'Eleven',        pic:'🧇', flavor:'A trail of Eggo crumbs runs out here. Every streetlight on the block is dead.' },
    { name:'Dustin',        pic:'🧢', flavor:'He is still in radio range, so Cerebro says he found the high ground.' },
    { name:'Max',           pic:'🛹', flavor:'She skated. It is downhill the whole way, and she never takes the long route.' },
    { name:'Will',          pic:'🔦', flavor:'He has been drawing this place all week. The green crayon is worn to a stub.' },
    { name:'Steve',         pic:'🏒', flavor:'He drove, so wherever he is, there is somewhere to park the Beemer.' },
    { name:'Vecna',         pic:'🕰️', flavor:'The clock has chimed twice. He is somewhere quiet, and he already knows where you will look.', boss:true },
    { name:'Ayan',          pic:'🎮', flavor:'He said he would be home before dinner. He was not home before dinner.' },
    { name:'Deepak Smithy', pic:'🔧', flavor:'Find the thing that is broken. He will be underneath it.' }
  ];

  const COMPASS = ['north','north-east','east','south-east','south','south-west','west','north-west'];
  const ARROWS  = ['⬆️','↗️','➡️','↘️','⬇️','↙️','⬅️','↖️'];
  const BULBS   = ['#ff2d3f','#3ddc97','#ffc73a','#4da3ff','#ff8f3f','#c77dff','#ff2d3f','#3ddc97'];

  /* ---------- deterministic daily seed ---------- */

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function hash(str){
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function mulberry32(a){
    return function(){
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- geometry, measured in blocks ---------- */

  const blocksBetween = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) / BLOCK;

  // SVG y grows downward, so north is -y.
  function bearing(from, to){
    return (Math.atan2(to.x - from.x, from.y - to.y) * 180 / Math.PI + 360) % 360;
  }

  const octant = deg => Math.round(deg / 45) % 8;
  const fmtBlocks = b => b < 0.05 ? 'right there' : b.toFixed(1) + (b < 1.05 ? ' block' : ' blocks');

  /* ---------- puzzle ---------- */

  const key = todayKey();
  const rnd = mulberry32(hash('findr::town::' + key));
  // The Town is the reference point, never the hiding place.
  const HIDEABLE = PLACES.filter(function(p){ return p.id !== 'town'; });
  const puzzle = {
    cast:  CAST[Math.floor(rnd() * CAST.length)],
    place: HIDEABLE[Math.floor(rnd() * HIDEABLE.length)],
    ud:    rnd() < 0.34                        // roughly one day in three
  };
  // Vecna takes a guess off you just by being the one you are hunting.
  const MAX_GUESSES = puzzle.cast.boss ? 4 : 5;

  const trueBearing = bearing(TOWN, puzzle.place);
  const trueBlocks  = blocksBetween(TOWN, puzzle.place);
  // In the Upside Down every reading comes back reversed. The clues are
  // mirrored and the player is told so — the map is wrong, not unfair.
  const clueBearing = puzzle.ud ? (trueBearing + 180) % 360 : trueBearing;

  function clueList(){
    const lo = Math.floor(trueBlocks * 2) / 2;
    return [
      puzzle.cast.flavor,
      'The reading points <b>' + COMPASS[octant(clueBearing)] + '</b> of The Town.',
      'It is <b>' + lo.toFixed(1) + ' to ' + (lo + 0.5).toFixed(1) + ' blocks</b> from the green.',
      'They picked it because <b>' + puzzle.place.hint + '</b>.'
    ];
  }

  /* ---------- state ---------- */

  let selected = null, guesses = [], done = false;
  const saveKey = 'findr::town::' + key;
  const el = id => document.getElementById(id);
  const svg = el('map');
  const SVGNS = 'http://www.w3.org/2000/svg';

  function save(){
    try { localStorage.setItem(saveKey, JSON.stringify({ guesses, done })); }
    catch(e){ /* private mode — just don't persist */ }
  }
  function load(){
    try { return JSON.parse(localStorage.getItem(saveKey) || 'null'); }
    catch(e){ return null; }
  }

  /* ---------- drawing the map ---------- */

  function node(tag, attrs, text){
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function drawMap(){
    AREAS.forEach(function(a){ svg.appendChild(node('polygon', { points:a.points, class:a.cls })); });

    // the railway runs east to west, just above Depot St
    svg.appendChild(node('line', { x1:60, y1:286, x2:940, y2:286, class:'rail' }));

    STREETS.forEach(function(s){
      svg.appendChild(node('line', {
        x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, class:'street ' + (s.major ? 'major' : 'minor')
      }));
      const horiz = Math.abs(s.y2 - s.y1) < Math.abs(s.x2 - s.x1);
      svg.appendChild(node('text', {
        class:'streetname',
        x: horiz ? 84 : s.x1 + 9,
        y: horiz ? s.y1 - 9 : 96,
        transform: horiz ? '' : 'rotate(90 ' + (s.x1 + 9) + ' 96)'
      }, s.name));
    });

    svg.appendChild(node('circle', { cx:TOWN.x, cy:TOWN.y, r:80, class:'green-ring' }));

    PLACES.forEach(function(p){
      const g = node('g', { class:'loc' + (p.id === 'town' ? ' town' : ''), 'data-id':p.id });
      g.appendChild(node('circle', { cx:p.x, cy:p.y, r:32, class:'halo' }));   // fat tap target
      g.appendChild(node('circle', { cx:p.x, cy:p.y, r:15, class:'dot' }));
      g.appendChild(node('text',   { x:p.x, y:p.y + 6,  class:'pic' }, p.pic));
      g.appendChild(node('text',   { x:p.x, y:p.y + 35, class:'label' }, p.name));
      g.addEventListener('click', function(){ pick(p.id); });
      svg.appendChild(g);
    });
  }

  const gfx = id => svg.querySelector('.loc[data-id="' + id + '"]');

  function pick(id){
    if (done || id === 'town') return;                             // the green is the ruler, not a hiding place
    if (guesses.some(function(g){ return g.id === id; })) return;   // already searched
    selected = id;
    PLACES.forEach(function(p){ gfx(p.id).classList.toggle('sel', p.id === id); });
    render();
  }

  /* ---------- the Upside Down ---------- */

  function enterUpsideDown(){
    document.body.classList.add('ud');
    const haze = el('haze');
    for (let i = 0; i < 16; i++){
      const s = document.createElement('div');
      s.className = 'spore';
      s.style.left = (Math.random() * 100) + '%';
      s.style.animationDuration = (9 + Math.random() * 11) + 's';
      s.style.animationDelay = (-Math.random() * 14) + 's';
      haze.appendChild(s);
    }
  }

  /* ---------- rendering ---------- */

  function renderLights(){
    const box = el('lights');
    if (!guesses.length){ box.innerHTML = ''; return; }
    const b = guesses[guesses.length - 1].blocks;
    const steps = [0.01, 1, 1.5, 2, 2.5, 3.5, 4.5];   // blocks off -> bulbs lit
    let lit = 1;
    for (let i = 0; i < steps.length; i++) if (b <= steps[i]) { lit = 8 - i; break; }
    box.innerHTML = BULBS.map(function(c, i){
      const on = i < lit;
      return '<div class="bulb' + (on ? ' on' : '') + '" style="' +
        (on ? 'background:' + c + ';box-shadow:0 0 10px 2px ' + c + ';animation-delay:' + (i * .13) + 's' : '') +
      '"></div>';
    }).join('');
  }

  function render(){
    el('left').textContent = Math.max(0, MAX_GUESSES - guesses.length);
    el('targetPill').innerHTML = puzzle.cast.pic + ' Looking for <b>' + puzzle.cast.name + '</b>';

    el('banner').innerHTML = puzzle.ud
      ? '<div class="banner">🙃 <b>The gate is open.</b> Every clue reading comes back ' +
        '<b>mirrored</b> — flip it end for end. Your own guesses still read true.</div>'
      : (puzzle.cast.boss
          ? '<div class="banner">🕰️ <b>Vecna is the quarry.</b> He costs you a guess. You get four.</div>'
          : '');

    renderLights();

    const clues = clueList();
    const shown = Math.min(guesses.length + 1, clues.length);
    el('clues').innerHTML = clues.slice(0, shown).map(function(c, i){
      return '<div class="clue"><div class="n">Clue ' + (i+1) + '</div><p>' + c + '</p></div>';
    }).join('');

    el('guesses').innerHTML = guesses.map(function(g){
      const p = byId(g.id);
      return '<div class="guess-row">' +
               '<span>' + p.pic + ' ' + p.name + '</span>' +
               '<span class="dist" style="color:' + (g.hit ? 'var(--good)' : 'var(--muted)') + '">' +
                 (g.hit ? 'found them!' : fmtBlocks(g.blocks) + ' off') +
               '</span>' +
               '<span class="arrow">' + (g.hit ? '🎯' : ARROWS[octant(g.bearing)]) + '</span>' +
             '</div>';
    }).join('');

    const btn = el('guessBtn');
    if (done){
      btn.style.display = 'none';
      el('hint').style.display = 'none';
    } else {
      btn.disabled = !selected;
      btn.textContent = selected ? 'Search ' + byId(selected).name : 'Pick a place on the map';
    }
  }

  function finish(won){
    done = true;
    save();

    const g = gfx(puzzle.place.id);
    g.classList.add('hit');
    g.classList.remove('spent');
    if (puzzle.ud){
      const pic = g.querySelector('.pic');
      pic.textContent = '🌀';
      pic.classList.add('gate');
    }
    PLACES.forEach(function(p){ gfx(p.id).classList.remove('sel'); });

    const best = guesses.reduce(function(m, x){ return Math.min(m, x.blocks); }, Infinity);
    const share = (puzzle.ud ? '🙃' : '🔦') + ' Findr ' + key + '  ' +
      (won ? guesses.length + '/' + MAX_GUESSES : 'X/' + MAX_GUESSES) + '\n' +
      guesses.map(function(x){ return x.hit ? '🎯' : ARROWS[octant(x.bearing)]; }).join('') +
      '\nclosest: ' + fmtBlocks(best);

    el('endBox').innerHTML =
      '<div class="result">' +
        '<h2>' + (won ? 'Found them.' : (puzzle.ud ? 'The gate closed.' : 'They got away.')) + '</h2>' +
        '<p style="margin:0;color:var(--muted)">' + puzzle.cast.pic +
          ' <span class="who">' + puzzle.cast.name + '</span> was hiding at ' +
          puzzle.place.pic + ' <b>' + puzzle.place.name + '</b> — ' +
          fmtBlocks(trueBlocks) + ' ' + COMPASS[octant(trueBearing)] + ' of The Town.</p>' +
      '</div>' +
      '<div class="share">' + share + '</div>' +
      '<button id="copyBtn">Copy result</button>' +
      '<p class="hint">Someone new hides every day at midnight.</p>';

    el('copyBtn').onclick = function(){
      navigator.clipboard.writeText(share).then(function(){
        el('copyBtn').textContent = 'Copied ✓';
      }, function(){
        el('copyBtn').textContent = 'Copy failed — select the text above';
      });
    };
    render();
  }

  function markSpent(g){
    const n = gfx(g.id);
    n.classList.remove('sel');
    n.classList.add('spent');
  }

  function submitGuess(){
    if (done || !selected) return;
    const p = byId(selected);
    const g = {
      id: p.id,
      hit: p.id === puzzle.place.id,
      blocks: blocksBetween(p, puzzle.place),
      bearing: bearing(p, puzzle.place)
    };
    guesses.push(g);
    markSpent(g);
    selected = null;
    save();

    if (g.hit) finish(true);
    else if (guesses.length >= MAX_GUESSES) finish(false);
    else render();
  }

  /* ---------- boot ---------- */

  el('dateLabel').textContent = key + ' · The Town';
  if (puzzle.ud) enterUpsideDown();
  drawMap();
  el('guessBtn').onclick = submitGuess;

  // pick up a game already in progress today
  const saved = load();
  if (saved && Array.isArray(saved.guesses) && saved.guesses.length){
    guesses = saved.guesses.filter(function(g){ return byId(g.id); });
    guesses.forEach(markSpent);
    const won = guesses.some(function(g){ return g.hit; });
    if (won || guesses.length >= MAX_GUESSES){ finish(won); }
  }
  render();
})();
</script>
</body>
</html>
