  /* ---------- movers ----------
     A vehicle crosses, rests a few seconds, then comes back from a random
     side. One element per vehicle, so there is only ever one of each. */

  let movers = [];

  function mover(el, opts){
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let stopped = false;
    const park = () => el.setAttribute('transform', 'translate(-3000,0)');
    park();
    function pass(){
      if (stopped) return;
      if (reduced.matches){ setTimeout(pass, 2000); return; }
      const dir  = Math.random() < 0.5 ? 1 : -1;
      const from = dir === 1 ? opts.span[0] : opts.span[1];
      const to   = dir === 1 ? opts.span[1] : opts.span[0];
      opts.face(dir);
      const dur = Math.abs(to - from) / opts.speed * 1000;
      const t0 = performance.now();
      (function step(){
        if (stopped) return;
        const k = Math.min(1, (performance.now() - t0) / dur);
        el.setAttribute('transform', 'translate(' + (from + (to - from) * k) + ',0)');
        if (k < 1) requestAnimationFrame(step);
        else {
          park();
          setTimeout(pass, (opts.gap[0] + Math.random() * (opts.gap[1] - opts.gap[0])) * 1000);
        }
      })();
    }
    setTimeout(pass, opts.firstDelay * 1000);
    return { stop:function(){ stopped = true; park(); } };
  }

  /* ---------- taxis ----------
     Yellow cabs, driven by GSAP along the lanes. Each one picks a random run
     of turns through the grid, drives in from offscreen keeping to the
     right-hand side of the road, rounds its corners, drives out, rests, and
     goes again. GSAP is vendored next to the game; if it ever fails to load
     the town simply has no traffic and everything else plays on. */

  // LANE is how far right of the centreline a cab drives. With a 7.5-unit
  // half-body it has to stay inside the narrowest street's 14-unit half-width.
  const TAXI_N = 5, TAXI_SPEED = 150, LANE = 6, CORNER = 16;
  let taxiFleet = [], ROADS = [];

  function taxiNode(){
    const g = node('g', { class:'taxi', transform:'translate(-3000,0)' });
    g.appendChild(node('ellipse', { cx:0, cy:2, rx:17, ry:8, class:'shadow' }));
    g.appendChild(node('circle', { cx:19, cy:-4.5, r:5, class:'headglow' }));
    g.appendChild(node('circle', { cx:19, cy:4.5, r:5, class:'headglow' }));
    g.appendChild(node('rect', { x:-16, y:-7.5, width:32, height:15, rx:4.5, class:'cab' }));
    g.appendChild(node('rect', { x:5, y:-6, width:5, height:12, rx:1.5, class:'glass' }));
    g.appendChild(node('rect', { x:-12, y:-6, width:4, height:12, rx:1.5, class:'glass' }));
    for (let i = 0; i < 4; i++){
      g.appendChild(node('rect', { x:-8 + i*4, y:-7.5, width:2, height:1.8, class:'check' }));
      g.appendChild(node('rect', { x:-6 + i*4, y:5.7, width:2, height:1.8, class:'check' }));
    }
    g.appendChild(node('rect', { x:-2.5, y:-2.2, width:5, height:4.4, rx:1, class:'sign' }));
    return g;
  }

  // A random run of turns through the road graph, never straight back the way
  // it came. Broadway is just more edges, so a cab takes the diagonal whenever
  // the walk happens to turn onto it.
  function taxiWaypoints(){
    let cur = ROADS[Math.floor(Math.random() * ROADS.length)], prev = null;
    const out = [cur];
    const steps = 7 + Math.floor(Math.random() * 6);
    for (let s = 0; s < steps; s++){
      const opts = cur.nb.filter(function(n){ return n !== prev; });
      if (!opts.length) break;
      let nxt = opts[Math.floor(Math.random() * opts.length)];
      // mostly carry straight on — city drivers hate turning
      if (prev && Math.random() < 0.6){
        const u = unitTo(prev, cur);
        let best = null, bestDot = -2;
        opts.forEach(function(n){
          const v = unitTo(cur, n), d = u.x * v.x + u.y * v.y;
          if (d > bestDot){ bestDot = d; best = n; }
        });
        if (best && bestDot > 0.3) nxt = best;
      }
      prev = cur; cur = nxt;
      out.push(cur);
    }
    return out.map(function(n){ return { x:n.x, y:n.y }; });
  }

  const unitTo = function(a, b){
    const L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    return { x:(b.x - a.x) / L, y:(b.y - a.y) / L };
  };

  // shift the route into the right-hand lane, and run both ends offscreen
  function taxiLane(pts){
    const stretch = function(a, b, k){
      const u = unitTo(b, a);
      return { x:a.x + u.x * k, y:a.y + u.y * k };
    };
    const run = [stretch(pts[0], pts[1], 420)]
      .concat(pts, [stretch(pts[pts.length-1], pts[pts.length-2], 420)]);
    const right = function(a, b){
      const u = unitTo(a, b);
      return { x:-u.y, y:u.x };            // y grows downward: this is the right side
    };
    return run.map(function(p, i){
      const n1 = i > 0 ? right(run[i-1], p) : right(p, run[i+1]);
      const n2 = i < run.length - 1 ? right(p, run[i+1]) : right(run[i-1], p);
      const dot = n1.x*n2.x + n1.y*n2.y;
      // miter join, exact at right angles; the floor keeps a hairpin off
      // Broadway from throwing the lane halfway across the city
      const k = LANE / Math.max(0.4, 1 + dot);
      return { x:p.x + (n1.x + n2.x) * k, y:p.y + (n1.y + n2.y) * k };
    });
  }

  // straights joined by rounded corners, as a path the cab can be driven along
  function taxiPathD(pts){
    let d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
    for (let i = 1; i < pts.length - 1; i++){
      const a = pts[i-1], p = pts[i], c = pts[i+1];
      const u1 = unitTo(a, p), u2 = unitTo(p, c);
      // never round away more than a third of the shorter leg, or a short
      // Broadway sliver between two crossings would swallow its own corners
      const r = Math.min(CORNER,
        Math.hypot(p.x-a.x, p.y-a.y) / 3, Math.hypot(c.x-p.x, c.y-p.y) / 3);
      d += ' L' + (p.x - u1.x*r).toFixed(1) + ',' + (p.y - u1.y*r).toFixed(1) +
           ' Q' + p.x.toFixed(1) + ',' + p.y.toFixed(1) +
           ' '  + (p.x + u2.x*r).toFixed(1) + ',' + (p.y + u2.y*r).toFixed(1);
    }
    const e = pts[pts.length - 1];
    return d + ' L' + e.x.toFixed(1) + ',' + e.y.toFixed(1);
  }

  function taxiGo(cab){
    if (!cab.el.isConnected) return;                       // the map was redrawn
    if (matchMedia('(prefers-reduced-motion: reduce)').matches){
      cab.timer = setTimeout(function(){ taxiGo(cab); }, 3000);
      return;
    }
    const route = taxiWaypoints();
    if (route.length < 3){                                 // a dead end: try again
      cab.timer = setTimeout(function(){ taxiGo(cab); }, 800);
      return;
    }
    const guide = node('path', { d:taxiPathD(taxiLane(route)), fill:'none', stroke:'none' });
    svg.appendChild(guide);
    cab.tween = gsap.to(cab.el, {
      duration: guide.getTotalLength() / TAXI_SPEED,
      ease: 'none',
      motionPath: { path: guide, autoRotate: true },
      onComplete: function(){
        guide.remove();
        cab.timer = setTimeout(function(){ taxiGo(cab); }, 600 + Math.random() * 2600);
      }
    });
  }

  function startTaxis(){
    taxiFleet.forEach(function(c){
      if (c.tween) c.tween.kill();
      clearTimeout(c.timer);
    });
    taxiFleet = [];
    if (!CITY) return;                                     // no cabs in the crayon town
    if (!window.gsap || !window.MotionPathPlugin) return;  // no framework, no traffic
    gsap.registerPlugin(MotionPathPlugin);
    ROADS = buildRoads();
    // clipped to the island, so a cab on its way off the map stops at the
    // coast (or takes the bridge) instead of driving out over the water
    const traffic = node('g', { class:'traffic', 'clip-path':'url(#isle)' });
    svg.appendChild(traffic);
    for (let i = 0; i < TAXI_N; i++){
      const cab = { el:taxiNode(), tween:null, timer:0 };
      traffic.appendChild(cab.el);
      taxiFleet.push(cab);
      cab.timer = setTimeout(function(){ taxiGo(cab); }, 300 + i * 1100);
    }
  }

  // A tap that lands near a place counts for it: the nearest one inside this
  // radius wins, which gives big finger-sized targets without any overlapping
  // circles on the map. City places sit a full grid block apart (230 units);
  // the Town packs them as close as 121, so its radius stays at 70.
  const NEAR = CITY ? 90 : 70;

  function nearestPlace(pt){
    let best = null, bestD = Infinity;
    PLACES.forEach(function(p){
      const d = Math.hypot(p.x - pt.x, p.y - pt.y);
      if (d < bestD){ bestD = d; best = p; }
    });
    return bestD <= NEAR ? best : null;
  }

  /* ---------- zoom: double-tap in, double-tap out, drag to move ----------
     Not pinch. iOS hands two-finger gestures to the browser before the page
     ever sees them, so a pinch zooms Safari's page and never reaches the map.
     A double-tap is a plain tap twice — every browser delivers it. */

  // The frame is whatever the places need, not a fixed square — move a place
  // to the edge of the county and the map grows to include it. COLD is the cold
  // end of the warmth bar: the widest gap on the map, recomputed alongside it.
  let BASE = { x:48, y:48, w:904, h:904 };
  let COLD = 9;

  function recomputeBounds(){
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    PLACES.forEach(function(p){
      x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
      y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
    });
    const m = 130;                       // room for the labels and the taller builds
    x0 -= m; x1 += m; y0 -= m; y1 += m;
    if (CITY){
      // the drawn city is bigger than its places — keep the whole island in
      // frame, piers and all
      x0 = Math.min(x0, SLAB.x0 - SLAB_PAD); x1 = Math.max(x1, SLAB.x1 + SLAB_PAD);
      y0 = Math.min(y0, SLAB.y0 - SLAB_PAD); y1 = Math.max(y1, SLAB.y1 + SLAB_PAD);
    }
    BASE = { x:x0, y:y0, w:x1 - x0, h:y1 - y0 };
    if (typeof recomputeScale === 'function') recomputeScale();
  }
  recomputeBounds();
  const MAX_ZOOM = 4;
  const TAP_ZOOM = 2.6;           // how far one double-tap goes in
  // The view is a width and a centre; its height follows the shape of the map
  // area. That way a zoomed-in view fills the box instead of leaving bands of
  // blank paper above and below it.
  let zoomW = BASE.w, viewCx = BASE.x + BASE.w / 2, viewCy = BASE.y + BASE.h / 2;
  const pointers = new Set();
  let panFrom = null, moved = 0, suppressClick = false;
  let lastTapAt = -1e9, lastTapPt = null;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function viewSize(){
    const rect = svg.getBoundingClientRect();
    return { w:zoomW, h:zoomW * (rect.width > 0 ? rect.height / rect.width : 1), rect:rect };
  }

  // How wide the view is when fully zoomed out. On a tall phone that is the
  // width of the town; on a wide laptop the town is limited by its height, so
  // the view has to be wider than the town to show all of it.
  function fullZoomW(){
    const rect = svg.getBoundingClientRect();
    const aspect = rect.width > 0 ? rect.height / rect.width : 1;
    return aspect >= BASE.h / BASE.w ? BASE.w : BASE.h / aspect;
  }

  // On a desktop the clue card floats over the right of the map, so when the
  // town is centred, bias it left by half of what the card covers. Otherwise
  // the places under the card cannot be seen — or tapped.
  function centreShift(v){
    if (window.innerWidth < 820) return 0;
    const card = document.querySelector('.panel-scroll');
    if (!card) return 0;
    const covered = Math.max(0, v.rect.right - card.getBoundingClientRect().left);
    return (covered / 2) * (v.w / v.rect.width);
  }

  function applyView(){
    const v = viewSize();
    // On whichever axis shows more than the whole town, centre it — but only
    // bias for the clue card as far as there is slack, or the leftmost place
    // gets pushed off the edge.
    if (v.w >= BASE.w){
      const lo = BASE.x + BASE.w - v.w / 2, hi = BASE.x + v.w / 2;
      viewCx = clamp(BASE.x + BASE.w / 2 + centreShift(v), Math.min(lo, hi), Math.max(lo, hi));
    } else {
      viewCx = clamp(viewCx, BASE.x + v.w / 2, BASE.x + BASE.w - v.w / 2);
    }
    viewCy = v.h >= BASE.h ? BASE.y + BASE.h / 2
           : clamp(viewCy, BASE.y + v.h / 2, BASE.y + BASE.h - v.h / 2);
    svg.setAttribute('viewBox',
      (viewCx - v.w / 2) + ' ' + (viewCy - v.h / 2) + ' ' + v.w + ' ' + v.h);
    const full = fullZoomW();
    el('zoomOut').classList.toggle('show', zoomW < full - 1);
    el('zin').disabled = zoomW <= BASE.w / MAX_ZOOM + 0.5;
    el('zminus').disabled = zoomW >= full - 0.5;
  }

  function resetView(){
    zoomW = fullZoomW();
    viewCx = BASE.x + BASE.w / 2;
    viewCy = BASE.y + BASE.h / 2;
    applyView();
  }

  // client pixels -> map units; the viewBox matches the box, so this is linear
  function toMap(px, py){
    const v = viewSize();
    return {
      x: viewCx - v.w / 2 + (px - v.rect.left) / v.rect.width  * v.w,
      y: viewCy - v.h / 2 + (py - v.rect.top)  / v.rect.height * v.h
    };
  }

  // zoom by `factor`, leaving the map point under the cursor where it is
  function zoomAt(focus, factor){
    const w = clamp(zoomW / factor, BASE.w / MAX_ZOOM, fullZoomW());
    const k = w / zoomW;
    viewCx = focus.x + (viewCx - focus.x) * k;
    viewCy = focus.y + (viewCy - focus.y) * k;
    zoomW = w;
    applyView();
  }

  function panBy(dxUnits, dyUnits){
    viewCx -= dxUnits;
    viewCy -= dyUnits;
    applyView();
  }

  // the map area changes shape when the phone turns
  function measureHeader(){
    document.documentElement.style.setProperty(
      '--header-h', document.querySelector('header').offsetHeight + 'px');
  }
  measureHeader();

  window.addEventListener('resize', function(){
    measureHeader();
    zoomW = Math.min(zoomW, fullZoomW());
    applyView();
  });

  svg.addEventListener('pointerdown', function(e){
    pointers.add(e.pointerId);
    moved = 0;
    // a fresh gesture starts trusted; a drag or a pinch can revoke that below
    if (pointers.size === 1) suppressClick = false;
    // one finger drags the map; two fingers is a pinch, handled on touch events
    panFrom = pointers.size === 1 ? { x:e.clientX, y:e.clientY } : null;
  });

  /* ---------- pinch, on touch events ----------
     Pointer events cannot call this off: preventDefault on a pointermove does
     not stop Safari running its own page zoom, which is why the pointer-based
     pinch did nothing on an iPhone. preventDefault on a two-finger touchmove
     does, and it is how every map library gets pinch working on iOS. */

  let pinchDist = 0, pinching = false;

  const twoFingerGap = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const twoFingerMid = t => toMap((t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2);

  svg.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      e.preventDefault();
      pinching = true;
      pinchDist = twoFingerGap(e.touches);
      panFrom = null;              // no longer a drag
      suppressClick = true;
    }
  }, { passive:false });

  svg.addEventListener('touchmove', function(e){
    if (!pinching || e.touches.length !== 2) return;
    e.preventDefault();            // this is what keeps the page from zooming
    const d = twoFingerGap(e.touches);
    // fingers this close are not a readable gesture, and dividing by a
    // near-zero gap would fling the zoom across its whole range in one frame
    if (pinchDist > 24 && d > 24) zoomAt(twoFingerMid(e.touches), clamp(d / pinchDist, 0.5, 2));
    pinchDist = d;
    suppressClick = true;
  }, { passive:false });

  function endTouch(e){
    if (e.touches.length < 2){ pinching = false; pinchDist = 0; }
  }
  svg.addEventListener('touchend', endTouch);
  svg.addEventListener('touchcancel', endTouch);

  // Safari raises its own gesture events too; refusing them stops the page zoom
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    svg.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false });
  });

  svg.addEventListener('pointermove', function(e){
    if (!panFrom || pointers.size !== 1) return;
    moved += Math.hypot(e.clientX - panFrom.x, e.clientY - panFrom.y);
    if (zoomW < fullZoomW()){
      const v = viewSize();
      const perPixel = v.w / v.rect.width;
      panBy((e.clientX - panFrom.x) * perPixel, (e.clientY - panFrom.y) * perPixel);
    }
    panFrom = { x:e.clientX, y:e.clientY };
    if (moved > 8) suppressClick = true;
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size === 0) panFrom = null;
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);

  svg.addEventListener('click', function(e){
    // a drag that travelled is not a tap on a place
    if (suppressClick){
      e.stopPropagation();
      e.preventDefault();
      suppressClick = false;
      return;
    }
    // performance.now(), not Date.now() — the clock is stubbed in tests
    const t = performance.now(), pt = { x:e.clientX, y:e.clientY };
    if (t - lastTapAt < 350 && lastTapPt && Math.hypot(pt.x - lastTapPt.x, pt.y - lastTapPt.y) < 32){
      lastTapAt = -1e9;
      if (zoomW < fullZoomW() - 1) resetView();      // second double-tap comes back out
      else zoomAt(toMap(pt.x, pt.y), TAP_ZOOM);      // otherwise zoom toward the tap
    } else {
      lastTapAt = t;
      lastTapPt = pt;
    }
    // a near miss still counts: pick the closest place to where the finger landed
    if (!e.target.closest('.loc')){
      const near = nearestPlace(toMap(pt.x, pt.y));
      if (near) pick(near.id);
    }
  }, true);

  svg.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomAt(toMap(e.clientX, e.clientY), e.deltaY < 0 ? 1.18 : 1 / 1.18);
  }, { passive:false });

  el('zoomOut').onclick = resetView;
  const viewCentre = () => ({ x:viewCx, y:viewCy });
  el('zin').onclick = function(){ zoomAt(viewCentre(), 1.5); };
  el('zminus').onclick = function(){ zoomAt(viewCentre(), 1 / 1.5); };

  function pick(id){
    if (done || id === 'town') return;                             // the green is the ruler, not a hiding place
    if (guesses.some(function(g){ return g.id === id; })) return;   // already searched
    selected = id;
    PLACES.forEach(function(p){ gfx(p.id).classList.toggle('sel', p.id === id); });
    render();
  }

  /* ---------- the Upside Down ---------- */

  // Spores exist from the start but only show once the light goes; tick()
  // fades them in with the dusk.
  function makeSpores(){
    const haze = el('haze');
    haze.innerHTML = '';
    for (let i = 0; i < 16; i++){
      const s = document.createElement('div');
      s.className = 'spore';
      s.style.left = (Math.random() * 100) + '%';
      s.style.animationDuration = (9 + Math.random() * 11) + 's';
      s.style.animationDelay = (-Math.random() * 14) + 's';
      haze.appendChild(s);
    }
  }

  /* ---------- rendering ---------- */

  // Ten blocks, filled by how close the last guess landed; COLD is declared with
  // the frame above, since recomputeBounds sets it before this point is reached.
  function recomputeScale(){
    let far = 0;
    for (let i = 0; i < PLACES.length; i++){
      for (let j = i + 1; j < PLACES.length; j++){
        far = Math.max(far, blocksBetween(PLACES[i], PLACES[j]));
      }
    }
    COLD = Math.max(1, far);
  }

  function renderWarmth(){
    const box = el('warmth');
    if (!guesses.length){ box.innerHTML = ''; return; }
    const g = guesses[guesses.length - 1];
    const filled = g.hit ? 10 : Math.min(10, Math.max(1, Math.ceil(10 * (1 - g.blocks / COLD))));
    const word = g.hit ? 'found' : filled >= 9 ? 'boiling' : filled >= 7 ? 'hot'
               : filled >= 5 ? 'warm' : filled >= 3 ? 'cold' : 'freezing';
    let segs = '';
    for (let i = 0; i < 10; i++) segs += '<div class="seg' + (i < filled ? ' on' : '') + '"></div>';
    box.innerHTML = '<div class="cap"><span>' + word + '</span><b>' + filled + '/10</b></div>' +
                    '<div class="bar">' + segs + '</div>';
  }

  /* ---------- the clock ----------
     Tea time to bedtime in one minute. An hour goes by every fifteen seconds:
     out at five, the light starts going at half seven, and whoever is still
     out there at nine is not coming home. */

  const CLOCK_START = 17 * 60;        // 5:00 pm, in minutes
  const DUSK_AT     = 19 * 60 + 30;   // 7:30 pm — the light goes, the vines come
  const NIGHT_AT    = 21 * 60;        // 9:00 pm — time is up
  const PACE = { fast:4, slow:2 };    // minutes per second: an hour per 15s or 30s
  const PACE_KEY = 'findr::pace';

  let minPerSec = PACE.fast, clockFrom = 0, clockTimer = null;

  const clockNow = () => CLOCK_START + (performance.now() - clockFrom) / 1000 * minPerSec;

  // Switching pace mid-hunt keeps the clock where it stands — only the rate
  // from here on changes.
  function setPace(mode, persist){
    const rate = PACE[mode] || PACE.fast;
    if (clockTimer && rate !== minPerSec){
      const held = Math.min(clockNow(), NIGHT_AT);
      minPerSec = rate;
      clockFrom = performance.now() - (held - CLOCK_START) / rate * 1000;
    } else {
      minPerSec = rate;
    }
    el('paceSlow').classList.toggle('on', mode === 'slow');
    el('paceFast').classList.toggle('on', mode !== 'slow');
    if (persist){ try { localStorage.setItem(PACE_KEY, mode); } catch(e){} }
    if (clockTimer) tick();
  }
  const duskAmount = m => clamp((m - DUSK_AT) / (NIGHT_AT - DUSK_AT), 0, 1);

  function fmtClock(mins){
    const t = Math.max(0, Math.floor(mins)), h24 = Math.floor(t / 60) % 24, m = t % 60;
    return (((h24 + 11) % 12) + 1) + ':' + String(m).padStart(2, '0') + (h24 < 12 ? ' AM' : ' PM');
  }

  function tick(){
    const mins = Math.min(clockNow(), NIGHT_AT);
    const dusk = duskAmount(mins);
    el('clock').textContent = fmtClock(mins) + (round ? ' · hunt ' + (round + 1) : '');
    el('clock').classList.toggle('late', dusk > 0);
    document.body.classList.toggle('lamps', mins >= 20 * 60);   // eight o'clock
    el('dusk').style.opacity = dusk;
    el('haze').style.opacity = dusk;
    document.body.classList.toggle('night', dusk > 0.45);
    renderVines(false);
    if (!done && clockNow() >= NIGHT_AT) finish(false, true);
  }

  function startClock(){
    clockFrom = performance.now();
    stopClock();
    if (ADMIN){                          // arranging the town is not a hunt
      el('clock').textContent = '5:00 PM · paused';
      el('clock').classList.remove('late');
      el('dusk').style.opacity = 0;
      el('haze').style.opacity = 0;
      document.body.classList.remove('night');
      renderVines(false);
      return;
    }
    clockTimer = setInterval(tick, 250);
    tick();
  }

  function stopClock(){
    if (clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  }

  // The vines come with the dark: nothing before half seven, everything by nine.
  // The reveal opens the gate the rest of the way.
  function renderVines(all){
    const p = duskAmount(clockNow());
    const reached = all ? Infinity : (p <= 0 ? -1 : Math.floor(p * 5));
    svg.querySelectorAll('.vine,.bud').forEach(function(n){
      n.classList.toggle('grown', +n.getAttribute('data-stage') <= reached);
    });
  }

  function render(){
    renderVines(false);
    el('left').textContent = Math.max(0, MAX_GUESSES - guesses.length);
    el('targetPill').innerHTML =
      '<span class="p-top">HAVE YOU SEEN</span>' +
      '<span class="p-name">' + puzzle.cast.pic + ' ' + puzzle.cast.name + '</span>';

    el('banner').innerHTML = puzzle.cast.boss
      ? '<div class="banner">🕰️ <b>Vecna is the quarry.</b> He costs you a guess. You get four.</div>'
      : '';

    renderWarmth();

    const clues = clueList();
    const shown = Math.min(guesses.length + 1, clues.length);
    const hintG = svg.querySelector('.hints');
    if (hintG){
      hintG.classList.toggle('lit2', !done && shown >= 2);
      hintG.classList.toggle('lit3', !done && shown >= 3);
    }
    // newest clue on top, so the one that matters needs no scrolling
    el('clues').innerHTML = clues.slice(0, shown).map(function(c, i){
      return '<div class="clue"><p><span class="n">Clue ' + (i+1) + '</span>' + c + '</p></div>';
    }).reverse().join('');

    el('guesses').innerHTML = guesses.map(function(g){
      const p = byId(g.id);
      return '<div class="guess-row">' +
               '<span>' + p.pic + ' ' + p.name + '</span>' +
               '<span class="dist" style="color:' + (g.hit ? 'var(--good)' : 'var(--muted)') + '">' +
                 (g.hit ? 'found them!' : '\u2248' + walkMin(g.blocks) + ' min away') +
               '</span>' +
               '<span class="arrow">' + (g.hit ? '🎯' : ARROWS[octant(g.bearing)]) + '</span>' +
             '</div>';
    }).join('');

    const btn = el('guessBtn');
    if (done){
      btn.style.display = 'none';
      el('hint').style.display = 'none';
    } else {
      btn.disabled = !selected;
      btn.textContent = selected ? 'Search ' + byId(selected).name : 'Pick a place on the map';
      // the zoom hint has done its job once the hunt is under way
      el('hint').style.display = guesses.length ? 'none' : '';
    }
  }

  function finish(won, ranOut){
    done = true;
    stopClock();
    save();

    const g = gfx(puzzle.place.id);
    g.classList.add('hit');
    g.classList.remove('spent');
    (g.querySelector('.pic') || g.querySelector('.art')).classList.add('gate');
    PLACES.forEach(function(p){ gfx(p.id).classList.remove('sel'); });
    renderVines(true);

    const best = guesses.reduce(function(m, x){ return Math.min(m, x.blocks); }, Infinity);
    const share = '🔦 Home Before Dinner ' + key + '  ' +
      (won ? guesses.length + '/' + MAX_GUESSES : 'X/' + MAX_GUESSES) + '\n' +
      guesses.map(function(x){ return x.hit ? '🎯' : ARROWS[octant(x.bearing)]; }).join('') +
      '\nclosest: ' + (best < 0.05 ? 'right there' : '\u2248' + walkMin(best) + ' min');

    el('endBox').innerHTML =
      '<div class="result">' +
        '<h2>' + (won ? 'Found them.' : ranOut ? 'Nine o&rsquo;clock.' : 'They got away.') + '</h2>' +
        '<p style="margin:0;color:var(--muted)">' + puzzle.cast.pic +
          ' <span class="who">' + puzzle.cast.name + '</span> was hiding at ' +
          puzzle.place.pic + ' <b>' + puzzle.place.name + '</b> — about ' +
          walkMin(trueBlocks) + (walkMin(trueBlocks) === 1 ? ' minute' : ' minutes') + ' from The Town.</p>' +
      '</div>' +
      '<div class="share">' + share + '</div>' +
      '<p class="hint">Someone new misses dinner every day at midnight.</p>';

    const box = document.querySelector('.panel-scroll');
    if (box) box.scrollTo({ top:box.scrollHeight, behavior:'smooth' });
    render();
  }

  function markSpent(g){
    const n = gfx(g.id);
    n.classList.remove('sel');
    n.classList.add('spent');
  }

  function submitGuess(){
    if (done || !selected) return;
    const p = byId(selected);
    const g = {
      id: p.id,
      hit: p.id === puzzle.place.id,
      blocks: blocksBetween(p, puzzle.place),
      bearing: bearing(p, puzzle.place)
    };
    guesses.push(g);
    markSpent(g);
    selected = null;
    save();

    if (g.hit) finish(true);
    else if (guesses.length >= MAX_GUESSES) finish(false);
    else { render(); showNewestClue(); }
  }

  // The newest clue is at the top of the list, so this is just a trip home.
  function showNewestClue(){
    const box = document.querySelector('.panel-scroll');
    if (box) box.scrollTo({ top:0, behavior:'smooth' });
  }

  /* ---------- boot ---------- */

  // Draw a round from scratch: fresh map, fresh theme, fresh panel.
  function startRound(r, resume){
    setRound(r);
    selected = null;
    guesses = [];
    done = false;

    makeSpores();
    svg.textContent = '';
    resetView();
    drawMap();

    el('endBox').innerHTML = '';
    el('guessBtn').style.display = '';
    el('hint').style.display = '';
    el('dusk').style.opacity = 0;
    el('haze').style.opacity = 0;
    document.body.classList.remove('night');
    startClock();

    if (ADMIN) setTimeout(adminReport, 60);

    if (resume){
      const saved = load();
      if (saved && Array.isArray(saved.guesses) && saved.guesses.length){
        guesses = saved.guesses.filter(function(g){ return byId(g.id); });
        // distances live on the map, not in the save: a hunt saved on one map
        // and resumed on the other gets its numbers remeasured
        guesses.forEach(function(g){
          const p = byId(g.id);
          g.hit = p.id === puzzle.place.id;
          g.blocks = blocksBetween(p, puzzle.place);
          g.bearing = bearing(p, puzzle.place);
        });
        guesses.forEach(markSpent);
        const won = guesses.some(function(g){ return g.hit; });
        if (won || guesses.length >= MAX_GUESSES){ finish(won); return; }
      }
    } else {
      save();
    }
    render();
  }

  if (ADMIN){
    document.body.classList.add('admin');
    loadAdminMoves();
    el('aCopy').onclick = function(){
      const txt = el('aOut').value;
      el('aOut').select();
      navigator.clipboard.writeText(txt).then(function(){
        el('aCopy').textContent = 'Copied \u2713';
        setTimeout(function(){ el('aCopy').textContent = 'Copy map'; }, 1400);
      }, function(){
        el('aCopy').textContent = 'Select + copy above';
      });
    };
    el('aRemove').onclick = function(){
      if (adminPicked) adminSetRemoved(adminPicked, !adminGone.has(adminPicked));
    };
    const MIN_KEY = 'findr::admin::min';
    const setMin = function(on){
      document.body.classList.toggle('amin', on);
      el('aMin').innerHTML = on ? '&plus;' : '&minus;';
      el('aMin').title = on ? 'Expand' : 'Minimise';
      try { localStorage.setItem(MIN_KEY, on ? '1' : '0'); } catch(e){}
    };
    el('aMin').onclick = function(){ setMin(!document.body.classList.contains('amin')); };
    try { setMin(localStorage.getItem(MIN_KEY) === '1'); } catch(e){ setMin(false); }

    el('aReset').onclick = function(){
      try { localStorage.removeItem(ADMIN_KEY); } catch(e){}
      location.reload();
    };
  }

  el('guessBtn').onclick = submitGuess;
  el('resetBtn').onclick = function(){ startRound(nextRound(), false); };
  el('paceSlow').onclick = function(){ setPace('slow', true); };
  el('paceFast').onclick = function(){ setPace('fast', true); };

  // Two maps, one game: switching remembers the choice and reloads, so the
  // whole page lives in a single mode. The hunt itself carries straight over.
  el('mapTown').classList.toggle('on', !CITY);
  el('mapCity').classList.toggle('on', CITY);
  function switchMap(m){
    try { localStorage.setItem('findr::map', m); } catch(e){}
    const qs = location.search.replace(/([?&])map=(city|town)\b&?/, '$1').replace(/[?&]$/, '');
    location.href = location.pathname + qs + (qs ? '&' : '?') + 'map=' + m;
  }
  el('mapTown').onclick = function(){ if (CITY) switchMap('town'); };
  el('mapCity').onclick = function(){ if (!CITY) switchMap('city'); };
  try { setPace(localStorage.getItem(PACE_KEY) === 'slow' ? 'slow' : 'fast', false); } catch(e){}

  setRound(loadRound());          // so nextRound() has a puzzle to differ from
  startRound(round, true);        // pick up a hunt already in progress
})();
</script>
</body>
