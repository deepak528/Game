<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the paper run under the notch; the safe-area insets
     below keep the actual controls clear of it -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7edd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Before Dinner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Home Before Dinner — The Town</title>
<!-- GSAP drives the taxis; vendored so the game still needs no network -->
<script src="vendor/gsap.min.js"></script>
<script src="vendor/MotionPathPlugin.min.js"></script>
<style>
  :root{
    --bg:#f7edd8; --panel:#fff8ea; --line:#e6d8bd; --ink:#3a332c;
    --muted:#8a7d6a; --accent:#e05e10; --good:#2e9e63;
    --glow:rgba(224,94,16,.25);
    --paper:#fbf3df; --road:#b6ab97; --road2:#d2c8b3; --rail:#a68d72;
    --card:rgba(0,0,0,.05); --seg:rgba(0,0,0,.1); --sharebg:rgba(0,0,0,.05);
    --dash:#ffdf7e; --dis-bg:#ece1cb; --dis-ink:#a3947e;
  }
  /* the City map floats in the river; the Town map sits on cream paper */
  body.city{--paper:#9fcfe6; --rail:#8f97a3}
  /* Night falls on the map alone: it dims, vines come through, spores drift
     and the sun goes out. The UI stays in daylight throughout. */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 "Comic Sans MS","Chalkboard SE","Marker Felt","Comic Neue","Segoe Print",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    transition:background .6s,color .6s;
    /* iOS: no blue flash on tap, no long-press callout, no text inflation,
       and no rubber-banding the whole page */
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }
  /* dvh follows Safari's shrinking toolbar; vh stays as the fallback */
  body{height:100vh}
  @supports (height:100dvh){ body{height:100dvh} }
  header{
    padding:10px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:10px; flex:0 0 auto; position:relative; z-index:5;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
  }
  header h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.5px;white-space:nowrap}
  header h1 span{color:var(--accent);text-shadow:0 0 12px var(--glow)}
  header .date{
    color:var(--muted);font-size:12px;margin-left:10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* the pace toggle (how fast the evening runs) and the map toggle */
  #paceCtl,#mapCtl{
    display:flex;gap:2px;align-self:center;
    border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card);
  }
  #mapCtl{margin-left:auto}
  .pace{
    width:auto;min-height:26px;padding:2px 9px;font-size:11.5px;font-weight:600;
    background:transparent;color:var(--muted);border-radius:999px;box-shadow:none;
  }
  .pace.on{background:var(--accent);color:#fff}
  @media (max-width:480px){ .pace .lbl{display:none} .pace{padding:2px 7px} }
  /* a narrow phone must not wrap the title, and with two toggle groups up
     there the clock still has to fit whole — everything tightens a notch */
  @media (max-width:410px){
    header{padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right));gap:6px}
    header h1{font-size:13.5px}
    header .date{font-size:10.5px;margin-left:0}
    .pace{padding:2px 5px;min-height:24px;font-size:11px}
  }

  /* The map gets 70% of the screen, but never so much that the panel has no
     room to work on a short landscape screen. */
  #mapWrap{
    flex:0 0 auto;position:relative;background:var(--paper);transition:background .6s;
    height:min(55vh,calc(100vh - 250px));
  }
  /* the notch and the home indicator come out of the map's share, so the
     buttons below never get squeezed off the bottom of the screen */
  @supports (height:100dvh){
    #mapWrap{
      height:min(55dvh,calc(100dvh - 250px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    }
  }
  /* touch-action:none turns off the browser's own double-tap zoom, so the
     map gets the double-tap instead */
  svg#map{width:100%;height:100%;display:block;touch-action:none;user-select:none}
  #zoomOut{
    position:absolute;right:10px;bottom:10px;width:auto;z-index:6;
    padding:7px 12px;font-size:13px;border-radius:8px;opacity:0;pointer-events:none;
    min-height:44px;touch-action:manipulation;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.12);transition:opacity .2s;
  }
  #zoomOut.show{opacity:1;pointer-events:auto}
  .zbtn{
    position:absolute;right:10px;width:44px;height:44px;z-index:6;padding:0;
    font-size:20px;line-height:1;border-radius:8px;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  #admin{
    position:absolute;left:12px;top:12px;z-index:8;width:296px;display:none;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.18);font-size:12px;
  }
  body.admin #admin{display:block}
  #admin .ahead{font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  #admin .ahint{color:var(--muted);margin-bottom:8px}
  #admin .amin{
    width:26px;min-height:26px;padding:0;border-radius:7px;font-size:15px;line-height:1;
    background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;
  }
  body.amin #admin{width:auto}
  body.amin #aBody{display:none}
  #admin .abtn[disabled]{opacity:.45;cursor:not-allowed}
  /* a place marked for removal stays visible but clearly struck off */
  .loc.removed{opacity:.3}
  .loc.removed .label{text-decoration:line-through}
  .loc.picked .label{fill:var(--accent);font-weight:800}
  #admin .arow{display:flex;gap:8px;align-items:center;margin-bottom:8px;color:var(--muted)}
  #admin .abtn{
    width:auto;flex:1 1 0;min-height:34px;padding:6px 10px;font-size:12.5px;border-radius:8px;
    background:var(--accent);color:#fff;box-shadow:none;
  }
  #admin .abtn.ghosty{background:transparent;color:var(--muted);border:1px solid var(--line)}
  #admin textarea{
    width:100%;height:104px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line);border-radius:8px;padding:6px;resize:vertical;
    background:rgba(0,0,0,.04);color:var(--ink);
  }
  #admin .warn{color:#c0392b;font-weight:700}
  #admin .ok{color:#2e9e63;font-weight:700}
  body.admin .loc{cursor:grab}
  body.admin .loc.dragging{cursor:grabbing}
  #zin{bottom:114px}
  #zminus{bottom:62px}
  /* night coming down over the town, from half seven onwards */
  #dusk{
    position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;
    transition:opacity .4s linear;
    background:linear-gradient(180deg,rgba(46,34,86,.62),rgba(10,12,34,.74));
  }
  header .date.late{color:#8f1626;font-weight:700}
  #haze{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;z-index:4}
  .spore{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(190,26,48,.8);box-shadow:0 0 6px 2px rgba(220,50,70,.45);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translate3d(0,110%,0) scale(.6);opacity:0}
    12%{opacity:.9} 88%{opacity:.7}
    100%{transform:translate3d(24px,-15%,0) scale(1.15);opacity:0}
  }

  /* --- the maps. The Town is the crayon drawing; the City is a midtown grid
     where the asphalt is one slab underneath, the blocks sit on top, and the
     streets are simply the gaps between blocks. --- */
  .street{stroke:var(--road);stroke-linecap:round;fill:none}
  .street.major{stroke-width:13}
  .street.minor{stroke:var(--road2);stroke-width:7}
  .cline{stroke:var(--dash);stroke-width:3;stroke-dasharray:15 11;stroke-linecap:round;fill:none}
  .lake{fill:#a4d9f2}
  .sun-disc{fill:#ffd43b;stroke:#f2a71b;stroke-width:2.5}
  .sun-ray{stroke:#f2a71b;stroke-width:4;stroke-linecap:round}
  .sun-eye{fill:#8a5a00}
  .sun-mouth{fill:none;stroke:#8a5a00;stroke-width:2.5;stroke-linecap:round}
  /* the sun goes out as the light goes */
  .sun-disc,.sun-ray{transition:fill .8s,stroke .8s}
  body.night .sun-disc{fill:#3b3556;stroke:#2b2740}
  body.night .sun-ray{stroke:#2b2740}
  body.night .sun-eye,body.night .sun-mouth{display:none}
  .slide{stroke:#d0873f;stroke-width:7;stroke-linecap:round}
  .asphalt{fill:#26282d}
  .sidewalk{fill:#d5d8dc}
  /* paint opacity is set per line as it is drawn — the city's road markings
     are worn, and a blanket rule here would override that */
  .lane-y{stroke:#e8b62c;stroke-width:2.6}
  .lane-w{stroke:#f2f3f5;stroke-width:2.4;stroke-dasharray:16 20}
  .xwalk{stroke:#e8eaee;stroke-width:8;stroke-dasharray:3.5 4.5}
  .bway-walk{fill:none;stroke:#d5d8dc;stroke-linecap:butt}
  .bway-road{fill:none;stroke:#26282d;stroke-linecap:butt}
  .sqlawn{fill:#6cbb63;stroke:#dfe3e7;stroke-width:3}
  .sqname{
    fill:#22402a;font-size:13px;font-weight:700;font-family:inherit;
    text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:#cfeac9;stroke-width:3px;stroke-linejoin:round;
  }
  /* street furniture: hydrants, scaffolding, and a vent that keeps steaming */
  .hydrant{fill:#d24b3e;stroke:#8f2f26;stroke-width:.8}
  .scaff{stroke:#c8a34a;stroke-width:2.4;fill:none;stroke-linecap:round}
  .scaff-deck{fill:#e0c27c;opacity:.85}
  .vent{fill:#4c525a;stroke:#2f343a;stroke-width:1}
  .steam{
    fill:#eef2f6;opacity:0;transform-box:fill-box;transform-origin:center bottom;
    animation:steamup 5.5s ease-out infinite;
  }
  @keyframes steamup{
    0%{opacity:0;transform:translateY(0) scale(.5)}
    22%{opacity:.5}
    100%{opacity:0;transform:translateY(-52px) scale(1.7)}
  }
  .rail{stroke:var(--rail);stroke-width:3;stroke-dasharray:9 7;fill:none}
  .streetname{fill:var(--muted);font-size:13px;opacity:.8;font-family:inherit;pointer-events:none}
  body.city .streetname{
    fill:#f2f3f6;opacity:.9;
    paint-order:stroke;stroke:#26282d;stroke-width:5px;stroke-linejoin:round;
  }
  .cable{stroke:#5b6570;stroke-width:4;fill:none}
  .btower{fill:#5b6570}
  .bdeck{fill:#3a3f46}
  .green-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:.35}
  /* the lots, coloured in with the old crayons so the grid stays friendly */
  .b0{fill:#ffeaa7}.b1{fill:#ffd6de}.b2{fill:#c9edcb}.b3{fill:#cbe7f8}
  .b4{fill:#ffdfba}.b5{fill:#e4daf8}.b6{fill:#dcf2b0}.b7{fill:#ffe3d2}
  .b8{fill:#b7e6a6}
  .lawn{fill:#93d38b}
  .pond{fill:#7cc7ea}
  .ppath{fill:none;stroke:#e9e0c6;stroke-width:10;stroke-linecap:round;opacity:.9}
  /* yellow cabs, GSAP-driven along the lanes */
  .taxi .cab{fill:#ffce0a;stroke:#b8901f;stroke-width:1}
  .taxi .glass{fill:#39424e}
  .taxi .check{fill:#23252a}
  .taxi .sign{fill:#fff3c4;stroke:#b8901f;stroke-width:.8}
  .taxi .headglow{fill:#fff3b8;opacity:0;transition:opacity .8s}
  body.night .taxi .headglow{opacity:.85}
  /* vines draw themselves on as the night comes down */
  .vine{
    fill:none;stroke:#8f1626;stroke-linecap:round;stroke-linejoin:round;opacity:.9;
    stroke-dashoffset:var(--len);transition:stroke-dashoffset 1s ease-out;
  }
  .vine.alt{stroke:#ab2136}
  .vine.grown{stroke-dashoffset:0}
  .bud{
    fill:#8f1626;opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;
    transition:opacity .45s .55s ease-out,transform .45s .55s ease-out;
  }
  .bud.grown{opacity:.9;transform:scale(1)}
  .loc{cursor:pointer}
  .loc .halo{fill:transparent}
  .loc .dot{fill:var(--panel);stroke:var(--muted);stroke-width:2;transition:stroke .2s,fill .2s}
  .loc .label{
    fill:var(--ink);font-size:15.5px;font-weight:600;text-anchor:middle;
    paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;
    font-family:inherit;pointer-events:none;
  }
  .loc .pic{font-size:29px;text-anchor:middle;pointer-events:none}
  /* markers idle with a gentle bob; hover grows them a fifth. The two live on
     nested groups so the transforms never fight over one element. */
  /* the visuals never take the pointer — the halo is the one true tap target */
  .marker{transform-box:fill-box;transform-origin:center;transition:transform .18s ease-out;pointer-events:none}
  .bob{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
  .loc.spent .bob{animation:none}
  .loc.sel .marker{transform:scale(1.18)}
  @media (hover:hover){
    .loc:not(.town):not(.spent):hover .marker{transform:scale(1.2)}
  }
  /* desktop: bigger markers to match the bigger map; hover stays +20% */
  @media (min-width:820px){
    .marker{transform:scale(1.15)}
    .loc.sel .marker{transform:scale(1.32)}
    .loc:not(.town):not(.spent):hover .marker{transform:scale(1.38)}
  }
  .loc:hover .dot{stroke:var(--accent)}
  .loc.sel .dot{stroke:var(--accent);fill:var(--accent);stroke-width:3}
  .loc.sel .label{fill:var(--accent)}
  .loc.spent{opacity:.34}
  .loc.spent .dot{stroke-dasharray:3 3}
  .loc.hit .dot{stroke:var(--good);fill:var(--good)}
  .loc.town{cursor:default}
  .loc.town .dot{stroke:var(--accent);stroke-width:3}
  .loc.town .label{fill:var(--accent);font-size:18px;letter-spacing:.5px}
  .gate{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  /* the clue light: a flashlight beam and a ring, lit as their clues unlock */
  .beam{fill:url(#beamGrad);filter:url(#soften);opacity:0;transition:opacity .8s ease-out;pointer-events:none}
  .ring{fill:none;stroke:#ffcf4a;opacity:0;transition:opacity .8s ease-out;pointer-events:none;
        filter:url(#soften)}
  .hints.lit2 .beam{opacity:1}
  .hints.lit3 .ring{opacity:.5}
  body.night .beam{opacity:0}
  body.night .hints.lit2 .beam{opacity:1;filter:url(#soften) brightness(1.5)}
  /* the kid on the swing — a whole one */
  .kid{stroke:#3a332c;stroke-width:2.6;stroke-linecap:round;fill:none}
  .kid-head{fill:#f6c98a;stroke:#3a332c;stroke-width:2}
  .seat{stroke:#7a5c3a;stroke-width:4;stroke-linecap:round}
  /* the freight */
  .tengine{fill:#8f3f3a}
  .tstack{fill:#5f4038}
  .twheel{fill:#4a4038;stroke:#2f2823;stroke-width:1}
  .tcar{stroke:#00000022;stroke-width:1}
  /* places that are built rather than lettered */
  .art{pointer-events:none}
  .shadow{fill:rgba(0,0,0,.12)}
  .art :is(polygon,rect,ellipse,path,circle):not(.shadow){
    stroke-linejoin:round;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.22));
  }
  .blab{font-family:inherit;font-weight:700;letter-spacing:.5px}
  .strut{stroke:#7e93a6;stroke-width:2.5;stroke-linecap:round}
  .lamppost{stroke:#6a6156;stroke-width:2.5;stroke-linecap:round;fill:none}
  .lamphead{fill:#dfd7c6;stroke:#6a6156;stroke-width:1}
  .lampglow{fill:#ffd769;opacity:0;transition:opacity 1.2s}
  body.lamps .lampglow{opacity:.6}
  body.lamps .lamphead{fill:#ffe9a4}
  /* --- life around the town --- */
  .scene{font-family:inherit;text-anchor:middle;pointer-events:none;user-select:none}
  .pline{stroke:#8a6f4d;stroke-width:5;stroke-linecap:round;fill:none}
  .chain{stroke:#8a6f4d;stroke-width:3;stroke-linecap:round}
  .swing-arm{transform-box:fill-box;transform-origin:top center;animation:sway 2.4s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
  .pball{animation:bounce 1.7s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
  /* the cyclist and the freight are script-driven so a pass can start from
     either side; only the night fade lives in CSS */
  /* by nightfall the kids and the cyclist have gone home; the freight has not */
  .swing-arm,.pball,.rider{transition:opacity 1.5s}
  body.night .swing-arm,body.night .pball,body.night .rider{opacity:0}
  @media (prefers-reduced-motion:reduce){
    .bob,.swing-arm,.pball,.gate,.steam{animation:none}
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  /* --- panel --- */
  .panel{
    flex:1 1 auto;min-height:0;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 14px;position:relative;z-index:5;display:flex;flex-direction:column;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
  }
  /* Clues scroll; the buttons stay put, so the guess is always in reach. */
  .panel-scroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  /* both actions on one row, the guess taking the lion's share */
  .panel-foot{flex:0 0 auto;padding-top:8px;display:flex;gap:8px;align-items:stretch}
  .panel-foot #guessBtn{flex:2.4 1 0}
  .panel-foot #resetBtn{flex:1 1 0}
  .panel-foot button{
    width:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .status{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .status .pill{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:2px 9px;font-size:11.5px;color:var(--muted);white-space:nowrap
  }
  .status .pill b{color:var(--ink)}
  .banner{
    border:1px solid var(--accent);background:rgba(255,45,63,.09);
    border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13.5px;
    box-shadow:0 0 22px -6px var(--glow);
  }
  .banner b{color:var(--accent)}
  /* the missing poster */
  /* one line, so the clue below it still fits on a small phone */
  .poster{
    display:inline-flex;align-items:baseline;gap:7px;
    background:#fffdf4;border:2px dashed #4a4238;border-radius:4px;
    padding:2px 10px 3px;transform:rotate(-1.5deg);
    box-shadow:2px 2px 0 rgba(0,0,0,.1);
  }
  .poster .p-top{font-size:9px;letter-spacing:1.5px;color:var(--muted);white-space:nowrap}
  .poster .p-name{font-size:14px;font-weight:700;line-height:1.15;white-space:nowrap}

  .warmth{margin:0 0 8px}
  .warmth:empty{display:none}          /* no bar, no gap, before the first guess */
  .warmth .cap{
    display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px;
  }
  .warmth .cap b{color:var(--accent);letter-spacing:0}
  .bar{display:flex;gap:4px}
  .seg{
    flex:1 1 0;height:12px;border-radius:2px;background:var(--seg);
    transition:background .3s;
  }
  .seg.on{background:var(--accent)}
  .clue{
    border-left:3px solid var(--accent);background:var(--card);
    padding:7px 12px;margin:0 0 6px;border-radius:0 6px 6px 0;
  }
  /* the clue number rides inline with the text — a whole line saved */
  .clue .n{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-right:6px}
  .clue p{margin:0;font-size:14px;line-height:1.4}
  .guess-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;
  }
  .guess-row .dist{color:var(--muted);font-variant-numeric:tabular-nums}
  .guess-row .arrow{font-size:18px}
  button{
    font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;
    background:var(--accent);color:#fff;cursor:pointer;width:100%;
    min-height:44px;touch-action:manipulation;   /* Apple's minimum tap target */
  }
  button:disabled{background:var(--dis-bg);color:var(--dis-ink);cursor:not-allowed}
  button.ghost{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    padding:6px 10px;min-height:44px;font-size:13.5px;
  }
  button.ghost:hover{color:var(--accent);border-color:var(--accent)}
  .hint{color:var(--muted);font-size:11.5px;text-align:center;margin:6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* --- desktop: the map fills the whole window and the panel floats over it,
     clues top-right and buttons bottom-left, so nothing takes space from the
     town. --header-h is measured in JS, since the header grows with the
     safe-area inset. --- */
  @media (min-width:820px){
    body{position:relative}
    #mapWrap{flex:1 1 auto;height:auto;min-height:0}
    .panel{
      position:absolute;left:0;right:0;bottom:0;top:var(--header-h,56px);
      background:none;border-top:0;padding:0;display:block;pointer-events:none;z-index:7;
    }
    .panel-scroll{
      position:absolute;top:18px;right:18px;width:360px;max-height:calc(100% - 36px);
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.16);
      pointer-events:auto;
    }
    .panel-foot{
      position:absolute;left:18px;bottom:18px;width:330px;
      display:flex;flex-direction:column;gap:8px;
      padding:0;border:0;pointer-events:auto;
    }
    .panel-foot #guessBtn,.panel-foot #resetBtn{
      flex:0 0 auto;width:100%;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.18);
    }
    .panel-foot #resetBtn{background:var(--panel)}
    .hint{text-align:left}
  }
  .result{text-align:center;padding:4px 0 10px}
  .result h2{margin:0 0 4px;font-size:20px;font-weight:700}
  .result .who{color:var(--accent)}
  .share{
    white-space:pre-wrap;background:var(--sharebg);border:1px solid var(--line);
    border-radius:8px;padding:10px;margin:10px 0;font-size:14px;text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>HOME BEFORE <span>DINNER</span></h1>
  <div id="mapCtl" role="group" aria-label="Map">
    <button id="mapTown" class="pace">🖍️<span class="lbl"> Town</span></button>
    <button id="mapCity" class="pace">🗽<span class="lbl"> City</span></button>
  </div>
  <div id="paceCtl" role="group" aria-label="Clock speed">
    <button id="paceSlow" class="pace">🐢<span class="lbl"> Slow</span></button>
    <button id="paceFast" class="pace on">🐇<span class="lbl"> Fast</span></button>
  </div>
  <span class="date" id="clock">5:00 PM</span>
</header>

<div id="mapWrap">
  <!-- cropped to the drawn area: the town fills the frame instead of floating in margin -->
  <svg id="map" viewBox="-70 -80 1740 1300" preserveAspectRatio="xMidYMid meet" aria-label="Map of The Town"></svg>
  <div id="dusk"></div>
  <div id="haze"></div>
  <div id="admin">
    <div class="ahead">
      <span>&#128296; Admin</span>
      <button id="aMin" class="amin" title="Minimise">&minus;</button>
    </div>
    <div id="aBody">
      <div class="ahint">Drag any place to move it &middot; click one to select</div>
      <div class="arow"><span id="aPick">Nothing selected</span></div>
      <div class="arow">
        <button id="aRemove" class="abtn ghosty" disabled>Remove</button>
      </div>
      <div class="arow"><span id="aOverlap">checking&hellip;</span></div>
      <div class="arow">
        <button id="aCopy" class="abtn">Copy map</button>
        <button id="aReset" class="abtn ghosty">Reset</button>
      </div>
      <textarea id="aOut" readonly spellcheck="false"></textarea>
    </div>
  </div>
  <button id="zin" class="zbtn" aria-label="Zoom in">+</button>
  <button id="zminus" class="zbtn" aria-label="Zoom out">−</button>
  <button id="zoomOut">⤢ Whole town</button>
</div>

<div class="panel" id="panel">
  <div class="panel-scroll">
    <div class="status">
      <span class="pill">Guesses left <b id="left">5</b></span>
      <div class="poster" id="targetPill">Hunting…</div>
    </div>
    <div id="banner"></div>
    <div class="warmth" id="warmth"></div>
    <div id="clues"></div>
    <div id="guesses"></div>
    <div id="endBox"></div>
    <p class="hint" id="hint">Pinch or double-tap the map to zoom · drag to move</p>
  </div>
  <div class="panel-foot">
    <button id="guessBtn" disabled>Pick a place on the map</button>
    <button id="resetBtn" class="ghost">🔄 New hunt</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- the town, twice over ----------
     Two maps of the same places: the crayon Town, and the City — a midtown
     grid. ?map= in the URL wins, then the remembered choice; switching sets
     the choice and reloads, so a single mode holds for the whole page life. */

  const MAPMODE = (function(){
    const q = /[?&]map=(city|town)\b/.exec(location.search);
    if (q) return q[1];
    try { return localStorage.getItem('findr::map') === 'town' ? 'town' : 'city'; }
    catch(e){ return 'city'; }
  })();
  const CITY = MAPMODE === 'city';
  document.body.classList.toggle('city', CITY);

  // One block = 100 units. On the City grid every place owns a whole block
  // and The Town is the park in the middle; on the crayon Town the same
  // places sit where they always did, around the green at 500,500.
  const BLOCK = 100;
  const TOWN = CITY ? { x: 800, y: 575 } : { x: 500, y: 500 };

  const TOWN_XY = {
    town:[500,500], pizza:[332,369], library:[321,662], middle:[1047,655],
    high:[672,672], tower:[-165,663], diner:[96,765], arcade:[-25,423],
    lanes:[53,553], station:[500,246], bowl:[-7,224], pool:[609,786],
    field:[1419,651], sparks:[668,330], smithy:[633,144], bagel:[498,738],
    coffee:[1088,215], campagne:[496,865], video:[360,150], lab:[839,114],
    mall:[1474,400], cookies:[1243,403]
  };

  const PLACES = [
    { id:'town',    name:'The Town',          pic:'🏛️', x:800, y:575, hint:'the middle of everything' },
    { id:'bowl',    name:'The Old Bowl',      pic:'⛰️', x:160, y:115, hint:'the town gave up on that quarry and the kids did not' },
    { id:'video',   name:'Family Video',      pic:'📼', x:480, y:115, hint:'the horror aisle cannot be seen from the register' },
    { id:'station', name:'Train Station',     pic:'🚂', x:800, y:115, hint:'the freight goes through hard enough to rattle windows' },
    { id:'lab',     name:'Hawkins Lab',       pic:'🧪', x:1120, y:115, hint:'the fence says keep out and the gate was left open' },
    { id:'coffee',  name:"Mongo's Coffee",    pic:'☕', x:1440, y:115, hint:'the milk steamer hisses loud enough to cover any conversation' },
    { id:'arcade',  name:'Palace Arcade',     pic:'👾', x:160, y:345, hint:'it is loud, and nobody looks up from the cabinets' , noLabel:true },
    { id:'pizza',   name:"Pappardelle's Pizzeria", pic:'🍕', x:480, y:345, hint:'the whole block smells of oregano after four' },
    { id:'smithy',  name:"Smithy's Hardware", pic:'🔧', x:1440, y:1035, hint:'if a thing in this town is broken, the part is there' },
    { id:'sparks',  name:'Sparks Radio',      pic:'📻', x:1120, y:345, hint:'it is the only place in town selling a decent antenna' },
    { id:'cookies', name:'Crumbl Cookies',    pic:'🍪', x:1440, y:345, hint:'the queue goes out of the door on a Friday and the boxes are pink' },
    { id:'lanes',   name:'Lucky Salon',       pic:'💈', x:160, y:575, hint:'you can walk in as yourself and walk out as somebody else' },
    { id:'library', name:'Public Library',    pic:'📚', x:480, y:575, hint:'you need a card to get in, and quiet to stay' },
    { id:'high',    name:'High School',       pic:'🏫', x:1120, y:575, hint:'the field lights come on Friday nights' },
    { id:'mall',    name:'Starcourt Mall',    pic:'🛍️', x:1440, y:575, hint:'it is brand new and nobody looks twice at a stranger' },
    { id:'diner',   name:'The Grand Diner',   pic:'🥤', x:160, y:805, hint:'it is open late and the jukebox eats quarters' },
    { id:'tower',   name:'Water Tower',       pic:'🗼', x:160, y:1035, hint:'you can see the whole grid from the catwalk' },
    { id:'bagel',   name:'Stuff a Bagel',     pic:'🥯', x:800, y:805, hint:'the ovens run before sunrise and the line asks no questions' },
    { id:'middle',  name:'Middle School',     pic:'🎒', x:1120, y:805, hint:'the bell still rings at 2:40, even in summer' },
    { id:'field',   name:'Baseball Field',    pic:'⚾', x:1440, y:805, hint:'the dugout stays dry when nothing else does' },
    { id:'campagne',name:'Campagne House',    pic:'🥂', x:1120, y:1035, hint:'there is always a wedding on and nobody counts the guests' },
    { id:'pool',    name:'Community Pool',    pic:'🏊', x:800, y:1035, hint:'it is closed for the season and the fence is easy enough' }
  ];

  // PLACES carries the City coordinates; the Town map swaps its own in
  if (!CITY) PLACES.forEach(function(p){ const c = TOWN_XY[p.id]; p.x = c[0]; p.y = c[1]; });

  const byId = id => PLACES.filter(function(p){ return p.id === id; })[0];

  // A few places are built rather than lettered: a shoebox in perspective, with
  // a lit face, a shaded side and a roof, so they stand up off the paper.
  const BUILDS = {
    town: function(g, x, y){
      // the park gazebo: everything in town is measured from here
      g.appendChild(node('ellipse', { cx:x, cy:y+16, rx:22, ry:6, class:'shadow' }));
      g.appendChild(node('rect', { x:x-17, y:y+8, width:34, height:5, rx:2, fill:'#cfc6b2' }));
      [-13,-4.5,4,12.5].forEach(function(px){
        g.appendChild(node('rect', { x:x+px-1.5, y:y-9, width:3, height:17, fill:'#f3ecd9', stroke:'#b3a482', 'stroke-width':0.7 }));
      });
      g.appendChild(node('rect', { x:x-16, y:y-12, width:32, height:3.5, fill:'#e6ddc6', stroke:'#b3a482', 'stroke-width':0.7 }));
      g.appendChild(node('polygon', { points:(x-19)+','+(y-12)+' '+x+','+(y-26)+' '+(x+19)+','+(y-12), fill:'#2e7d5b', stroke:'#1f5b42', 'stroke-width':1 }));
      g.appendChild(node('circle', { cx:x, cy:y-28, r:2.2, fill:'#f2c14e' }));
    },
    middle: function(g, x, y){
      box(g, x-22, y+11, 44, 20, 7, '#e2a86b', '#c08a52', '#f0c99b');
      [[-16,-4],[-5,-4],[6,-4]].forEach(function(w){
        g.appendChild(node('rect', { x:x+w[0], y:y+w[1], width:8, height:6, fill:'#fdf3d8', stroke:'#00000018' }));
      });
      g.appendChild(node('rect', { x:x-4, y:y+2, width:9, height:9, fill:'#6f5140' }));
      g.appendChild(node('circle', { cx:x+13, cy:y+5, r:3.2, fill:'#fdf6e8', stroke:'#8a7250', 'stroke-width':1 }));
      g.appendChild(node('line', { x1:x-26, y1:y+11, x2:x-26, y2:y-16, class:'strut' }));
      g.appendChild(node('polygon', { points:(x-26)+','+(y-16)+' '+(x-14)+','+(y-13)+' '+(x-26)+','+(y-10), fill:'#4d79c9' }));
    },
    lanes: function(g, x, y){
      box(g, x-17, y+10, 34, 17, 6, '#f3d7e3', '#d8b3c4', '#fbe9f1');
      for (let i = 0; i < 5; i++){
        g.appendChild(node('rect', { x:x-17+i*6.8, y:y-11, width:6.8, height:4.5, fill:i%2 ? '#d95f8a' : '#fdf3f7' }));
      }
      g.appendChild(node('rect', { x:x-4, y:y+1, width:8, height:9, fill:'#7c5b6a' }));
      g.appendChild(node('rect', { x:x+8, y:y-2, width:7, height:6, fill:'#cfeef8' }));
      // the barber pole by the door
      g.appendChild(node('rect', { x:x-13, y:y-4, width:4, height:12, rx:2, fill:'#fff', stroke:'#b9a0ac', 'stroke-width':0.7 }));
      [[0,'#d94f4f'],[4,'#4f6fd9'],[8,'#d94f4f']].forEach(function(s){
        g.appendChild(node('rect', { x:x-13, y:y-3+s[0], width:4, height:2, fill:s[1] }));
      });
    },
    bowl: function(g, x, y){
      g.appendChild(node('ellipse', { cx:x, cy:y+6, rx:27, ry:14, fill:'#c9c4b8' }));
      g.appendChild(node('ellipse', { cx:x, cy:y+5, rx:20, ry:9.5, fill:'#a9a396' }));
      g.appendChild(node('ellipse', { cx:x, cy:y+4, rx:12, ry:5.5, fill:'#8e8879' }));
      g.appendChild(node('path', { d:'M'+(x-16)+','+(y+3)+' q16,-8 32,0', fill:'none', stroke:'#dcd7ca', 'stroke-width':1.6 }));
      // a skateboard left on the lip
      g.appendChild(node('rect', { x:x+12, y:y-6, width:13, height:3, rx:1.5, fill:'#d0873f', transform:'rotate(-18 '+(x+18)+' '+(y-5)+')' }));
      g.appendChild(node('circle', { cx:x+14, cy:y-2.5, r:1.4, fill:'#4a4038' }));
      g.appendChild(node('circle', { cx:x+22, cy:y-5, r:1.4, fill:'#4a4038' }));
    },
    sparks: function(g, x, y){
      box(g, x-17, y+10, 34, 16, 6, '#d9cbb0', '#bda98a', '#eadfc8');
      g.appendChild(node('rect', { x:x-13, y:y-2, width:9, height:7, fill:'#8fd3ef' }));
      g.appendChild(node('rect', { x:x+3, y:y+1, width:8, height:9, fill:'#6f5c44' }));
      // the lattice mast, and the light that never goes off
      g.appendChild(node('line', { x1:x-4, y1:y-6, x2:x-4, y2:y-30, class:'strut' }));
      g.appendChild(node('line', { x1:x-10, y1:y-6, x2:x-4, y2:y-20, class:'strut' }));
      g.appendChild(node('line', { x1:x+2, y1:y-6, x2:x-4, y2:y-20, class:'strut' }));
      g.appendChild(node('circle', { cx:x-4, cy:y-31, r:2, fill:'#e04b4b' }));
      g.appendChild(node('path', { d:'M'+(x-12)+','+(y-30)+' q8,-7 16,0', fill:'none', stroke:'#9fb4c9', 'stroke-width':1.4 }));
    },
    smithy: function(g, x, y){
      box(g, x-18, y+10, 36, 17, 6, '#c9d2d9', '#a7b2bc', '#e0e6ea');
      g.appendChild(node('rect', { x:x-21, y:y-14, width:42, height:8, rx:2, fill:'#455361', stroke:'#2f3a45', 'stroke-width':1 }));
      g.appendChild(node('text', { x:x, y:y-7.8, 'font-size':6, 'text-anchor':'middle', fill:'#ffd34e', class:'blab' }, 'HARDWARE'));
      g.appendChild(node('rect', { x:x-4, y:y+1, width:8, height:9, fill:'#3f4a54' }));
      g.appendChild(node('rect', { x:x-14, y:y-2, width:8, height:6, fill:'#fdf3d8' }));
      g.appendChild(node('rect', { x:x+7, y:y-2, width:8, height:6, fill:'#fdf3d8' }));
      // the hammer over the door
      g.appendChild(node('line', { x1:x+14, y1:y-16, x2:x+20, y2:y-24, stroke:'#7a5c3a', 'stroke-width':2, 'stroke-linecap':'round' }));
      g.appendChild(node('rect', { x:x+16, y:y-27, width:9, height:4.5, rx:1.5, fill:'#5b676f', transform:'rotate(35 '+(x+20)+' '+(y-25)+')' }));
    },
    bagel: function(g, x, y){
      box(g, x-17, y+10, 34, 16, 6, '#f2e2c2', '#d8c49a', '#faefd8');
      for (let i = 0; i < 5; i++){
        g.appendChild(node('rect', { x:x-17+i*6.8, y:y-10, width:6.8, height:4.5, fill:i%2 ? '#d9a03f' : '#fdf6e6' }));
      }
      g.appendChild(node('rect', { x:x-4, y:y+1, width:8, height:9, fill:'#7c6243' }));
      // the bagel itself, up on the roof
      g.appendChild(node('circle', { cx:x, cy:y-20, r:8, fill:'#e0a95c', stroke:'#b57f38', 'stroke-width':1.2 }));
      g.appendChild(node('circle', { cx:x, cy:y-20, r:3, fill:'#f2e2c2', stroke:'#b57f38', 'stroke-width':1 }));
      g.appendChild(node('path', { d:'M'+(x-6)+','+(y-24)+' q6,-3 12,0', fill:'none', stroke:'#fdf1da', 'stroke-width':1.6 }));
    },
    coffee: function(g, x, y){
      box(g, x-16, y+10, 32, 16, 6, '#b98a63', '#9a6f4d', '#d3a87e');
      g.appendChild(node('rect', { x:x-12, y:y-2, width:10, height:7, fill:'#ffd98a' }));
      g.appendChild(node('rect', { x:x+3, y:y+1, width:8, height:9, fill:'#5c4030' }));
      // a mug on the roof, still steaming
      g.appendChild(node('rect', { x:x-6, y:y-24, width:12, height:10, rx:2, fill:'#fdf6e8', stroke:'#8a6f4d', 'stroke-width':1.2 }));
      g.appendChild(node('path', { d:'M'+(x+6)+','+(y-22)+' q5,0 5,3.5 q0,3.5 -5,3.5', fill:'none', stroke:'#8a6f4d', 'stroke-width':1.6 }));
      g.appendChild(node('path', { d:'M'+(x-2)+','+(y-27)+' q2,-3 0,-6 M'+(x+2)+','+(y-27)+' q2,-3 0,-6', fill:'none', stroke:'#c9c2b4', 'stroke-width':1.4, 'stroke-linecap':'round' }));
    },
    video: function(g, x, y){
      box(g, x-18, y+10, 36, 17, 6, '#5878b8', '#43609a', '#7593cc');
      g.appendChild(node('rect', { x:x-21, y:y-14, width:42, height:8, rx:2, fill:'#f7c531', stroke:'#c99a2e', 'stroke-width':1 }));
      g.appendChild(node('text', { x:x, y:y-7.8, 'font-size':6, 'text-anchor':'middle', fill:'#31456e', class:'blab' }, 'VIDEO'));
      g.appendChild(node('rect', { x:x-13, y:y-2, width:9, height:7, fill:'#bcd7f2' }));
      g.appendChild(node('rect', { x:x+4, y:y-2, width:9, height:7, fill:'#bcd7f2' }));
      g.appendChild(node('rect', { x:x-4, y:y+2, width:8, height:8, fill:'#2c3a5c' }));
      // a VHS above the sign
      g.appendChild(node('rect', { x:x-8, y:y-22, width:16, height:7, rx:1.5, fill:'#2b2b30', stroke:'#111', 'stroke-width':0.8 }));
      g.appendChild(node('circle', { cx:x-3.5, cy:y-18.5, r:1.6, fill:'#777' }));
      g.appendChild(node('circle', { cx:x+3.5, cy:y-18.5, r:1.6, fill:'#777' }));
    },
    mall: function(g, x, y){
      box(g, x-20, y+8, 40, 20, 9, '#e8b3c6', '#c98ba2', '#f6d3df');
      g.appendChild(node('rect', { x:x-13, y:y-4, width:26, height:11, rx:2, fill:'#f7e6a8', stroke:'#c9a94e', 'stroke-width':1 }));
      g.appendChild(node('text', { x:x, y:y+5, 'font-size':9, 'text-anchor':'middle', fill:'#a2543c', class:'blab' }, 'MALL'));
    },
    lab: function(g, x, y){
      box(g, x-18, y+9, 36, 22, 8, '#cfd8e6', '#a9b6c9', '#e6ecf4');
      g.appendChild(node('rect', { x:x+4, y:y-16, width:9, height:18, fill:'#b9c5d6', stroke:'#8fa0b6', 'stroke-width':1 }));
      [[-12,-2],[-2,-2],[-12,4],[-2,4]].forEach(function(w){
        g.appendChild(node('rect', { x:x+w[0], y:y+w[1], width:7, height:5, fill:'#8fd3ef', opacity:.9 }));
      });
    },
    pool: function(g, x, y){
      g.appendChild(node('ellipse', { cx:x, cy:y+10, rx:24, ry:12, fill:'#dcd2bd' }));
      g.appendChild(node('ellipse', { cx:x, cy:y+9,  rx:19, ry:9,  fill:'#57bde3' }));
      g.appendChild(node('path', { d:'M'+(x-14)+','+(y+8)+' q7,-4 14,0 t14,0', fill:'none', stroke:'#bfe9f7', 'stroke-width':2, 'stroke-linecap':'round' }));
      g.appendChild(node('path', { d:'M'+(x+16)+','+(y-2)+' l6,-9 M'+(x+22)+','+(y-11)+' l0,10',
        fill:'none', stroke:'#c9b48f', 'stroke-width':2.5, 'stroke-linecap':'round' }));
    },
    tower: function(g, x, y){
      g.appendChild(node('ellipse', { cx:x, cy:y+18, rx:16, ry:5, class:'shadow' }));
      g.appendChild(node('line', { x1:x-10, y1:y+16, x2:x-4, y2:y-8, class:'strut' }));
      g.appendChild(node('line', { x1:x+10, y1:y+16, x2:x+4, y2:y-8, class:'strut' }));
      g.appendChild(node('line', { x1:x-8, y1:y+8, x2:x+8, y2:y+2, class:'strut' }));
      g.appendChild(node('line', { x1:x+8, y1:y+8, x2:x-8, y2:y+2, class:'strut' }));
      g.appendChild(node('rect', { x:x-12, y:y-24, width:24, height:17, rx:3, fill:'#a9bccb', stroke:'#7e93a6', 'stroke-width':1 }));
      g.appendChild(node('polygon', { points:(x-13)+','+(y-24)+' '+x+','+(y-34)+' '+(x+13)+','+(y-24), fill:'#8fa5b6' }));
    },
    station: function(g, x, y){
      box(g, x-20, y+10, 40, 15, 7, '#e0b089', '#c19170', '#f0cfae');
      g.appendChild(node('polygon', { points:(x-26)+','+(y-5)+' '+(x-18)+','+(y-13)+' '+(x+32)+','+(y-13)+' '+(x+24)+','+(y-5), fill:'#b98a63' }));
      g.appendChild(node('rect', { x:x-4, y:y-1, width:9, height:11, fill:'#6f5140' }));
      g.appendChild(node('rect', { x:x-15, y:y-1, width:7, height:6, fill:'#fdf3d8' }));
      g.appendChild(node('rect', { x:x+11, y:y-1, width:7, height:6, fill:'#fdf3d8' }));
    },

  function box(g, x, y, w, h, d, front, side, roof){

  // The grid, drawn from data: avenues run north-south, streets east-west,
  // and every block is the gap between them. Named like the city it copies.
  const AVX = [0, 320, 640, 960, 1280, 1600];       // nominal avenue centrelines
  const STY = [0, 230, 460, 690, 920, 1150];        // nominal street centrelines
  const AVE_NAMES = ['10th Ave','8th Ave','7th Ave','5th Ave','Park Ave','Lexington Ave'];
  const ST_NAMES  = ['59th St','57th St','55th St','53rd St','51st St','49th St'];
  const PARK = { col:2, row:2 };                     // The Town, mid-grid
  // the asphalt slab runs a little past the outer avenues, and the whole of it
  // stays in frame even though no place sits at its edge
  const SLAB = { x0:-70, y0:-80, x1:1670, y1:1220 };
  const SLAB_PAD = 60;              // the piers stick out past the nominal edge

  // Broadway does not care about the grid. It runs on the diagonal from the
  // top right to the bottom left, crossing every avenue and every street on
  // the way and shaving a corner off the park, which is what makes the wedge
  // lots and the little squares where it meets an avenue. It is threaded so
  // that at each row of blocks it passes midway between two of them.
  const BWAY = { x0:1120, y0:-80, x1:240, y1:1220 };
  const bwayX = y => BWAY.x0 + (BWAY.x1 - BWAY.x0) * (y - BWAY.y0) / (BWAY.y1 - BWAY.y0);
  const BWAY_W = 58;                // the widest road in town

  /* ---------- the grid, but nobody laid it with a ruler ----------
     No two roads are the same width and no two intersections line up exactly,
     so an avenue is a polyline through its own crossings rather than a
     straight line, and every block is a slightly different quadrilateral.
     Both come off one fixed seed, so the city is the same city every time. */

  const cityGeom = mulberry32(0x9d71);
  // No road is quite the width of its neighbour. The narrowest street still
  // has to hold a cab a lane's width off the centreline, which is what sets
  // the floor here.
  const AVW = AVX.map(function(){ return 38 + cityGeom() * 10; });   // 38–48
  const STW = STY.map(function(){ return 32 + cityGeom() * 8; });    // 32–40
  AVW[4] = 52;                      // Park Ave was laid out as a boulevard
  const JIT = 9;
  const NODE = AVX.map(function(ax){
    return STY.map(function(sy){
      return { x:ax + (cityGeom() - 0.5) * 2 * JIT, y:sy + (cityGeom() - 0.5) * 2 * JIT };
    });
  });
  const aveLine = i => NODE[i];
  const stLine  = j => NODE.map(function(col){ return col[j]; });

  // where a road sits at a given point along it, following its kinks
  function walkLine(line, v, along){
    for (let k = 1; k < line.length; k++){
      if (v <= line[k][along] || k === line.length - 1){
        const a = line[k-1], b = line[k];
        const t = (v - a[along]) / ((b[along] - a[along]) || 1);
        return along === 'y' ? a.x + (b.x - a.x) * t : a.y + (b.y - a.y) * t;
      }
    }
    return along === 'y' ? line[0].x : line[0].y;
  }
  const avXAt = (i, y) => walkLine(aveLine(i), y, 'y');
  const stYAt = (j, x) => walkLine(stLine(j), x, 'x');

  function segInt(p, p2, q, q2){
    const r = { x:p2.x - p.x, y:p2.y - p.y }, s = { x:q2.x - q.x, y:q2.y - q.y };
    const d = r.x * s.y - r.y * s.x;
    if (!d) return null;
    const t = ((q.x - p.x) * s.y - (q.y - p.y) * s.x) / d;
    const u = ((q.x - p.x) * r.y - (q.y - p.y) * r.x) / d;
    if (t < 0 || t > 1 || u < 0 || u > 1) return null;
    return { x:p.x + r.x * t, y:p.y + r.y * t };
  }

  // where Broadway meets a road, found by walking that road's segments
  function bwayMeet(line){
    const A = { x:BWAY.x0, y:BWAY.y0 }, B = { x:BWAY.x1, y:BWAY.y1 };
    for (let k = 1; k < line.length; k++){
      const hit = segInt(A, B, line[k-1], line[k]);
      if (hit) return hit;
    }
    return null;
  }

  // a closed shape with its corners rounded off
  function roundPoly(pts, r){
    let d = '';
    for (let i = 0; i < pts.length; i++){
      const p = pts[i], a = pts[(i - 1 + pts.length) % pts.length], b = pts[(i + 1) % pts.length];
      const u1 = unitTo(p, a), u2 = unitTo(p, b);
      const r1 = Math.min(r, Math.hypot(p.x - a.x, p.y - a.y) / 2.2);
      const r2 = Math.min(r, Math.hypot(p.x - b.x, p.y - b.y) / 2.2);
      d += (i ? ' L' : 'M') + (p.x + u1.x*r1).toFixed(1) + ',' + (p.y + u1.y*r1).toFixed(1) +
           ' Q' + p.x.toFixed(1) + ',' + p.y.toFixed(1) +
           ' '  + (p.x + u2.x*r2).toFixed(1) + ',' + (p.y + u2.y*r2).toFixed(1);
    }
    return d + ' Z';
  }

  // pull every corner of a quad in toward its middle
  function inset(q, d){
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;
    return q.map(function(p){
      const dx = cx - p.x, dy = cy - p.y, L = Math.hypot(dx, dy) || 1;
      return { x:p.x + dx / L * d, y:p.y + dy / L * d };
    });
  }

  // the four corners of one block, set back from the roads around it
  function blockQuad(c, r){
    return [
      { x:NODE[c][r].x     + AVW[c]/2,   y:NODE[c][r].y     + STW[r]/2 },
      { x:NODE[c+1][r].x   - AVW[c+1]/2, y:NODE[c+1][r].y   + STW[r]/2 },
      { x:NODE[c+1][r+1].x - AVW[c+1]/2, y:NODE[c+1][r+1].y - STW[r+1]/2 },
      { x:NODE[c][r+1].x   + AVW[c]/2,   y:NODE[c][r+1].y   - STW[r+1]/2 }
    ];
  }

  // The road network as a graph, so a cab can drive Broadway like any other
  // road instead of assuming everything meets at right angles. Nodes are
  // intersections — grid corners plus every Broadway crossing — and edges run
  // between neighbours along each avenue, street and Broadway itself.
  function buildRoads(){
    const nodes = new Map();
    const key = (x, y) => Math.round(x) + ',' + Math.round(y);
    const at = function(x, y){
      const k = key(x, y);
      if (!nodes.has(k)) nodes.set(k, { x:x, y:y, nb:[] });
      return nodes.get(k);
    };
    const chain = function(list){
      for (let i = 1; i < list.length; i++){
        if (list[i] === list[i-1]) continue;
        list[i-1].nb.push(list[i]);
        list[i].nb.push(list[i-1]);
      }
    };
    // an avenue runs through its own crossings, in order, plus wherever
    // Broadway cuts it; a street likewise
    const along = [];
    AVX.forEach(function(ax, i){
      const pts = aveLine(i).map(function(p){ return { x:p.x, y:p.y }; });
      const m = bwayMeet(aveLine(i));
      if (m){ pts.push(m); along.push(m); }
      pts.sort(function(a, b){ return a.y - b.y; });
      chain(pts.map(function(p){ return at(p.x, p.y); }));
    });
    STY.forEach(function(sy, j){
      const pts = stLine(j).map(function(p){ return { x:p.x, y:p.y }; });
      const m = bwayMeet(stLine(j));
      if (m){ pts.push(m); along.push(m); }
      pts.sort(function(a, b){ return a.x - b.x; });
      chain(pts.map(function(p){ return at(p.x, p.y); }));
    });
    along.sort(function(a, b){ return a.y - b.y; });
    chain(along.map(function(p){ return at(p.x, p.y); }));

    return [...nodes.values()];
  }

    { d:'M450,930 q50,10 76,40', w:4, alt:true, stage:3 },
    { d:'M980,-70 q38,90 -8,160', w:4, stage:3 },
    // the last one crosses midtown and stops at the edge of the park
    { d:'M1660,620 C1500,660 1400,600 1280,640 S1080,650 960,600 Q920,585 900,580', w:5, alt:true, stage:4 },
    { d:'M1280,640 q-26,40 -70,46', w:3.5, stage:4 }
  ];
  const BUDS = !CITY ? [
    { x:96,  y:560, r:4,   stage:2 }, { x:438, y:324, r:3.5, stage:3 },
    { x:736, y:450, r:4,   stage:1 }, { x:320, y:640, r:3.5, stage:2 },
    { x:720, y:750, r:3.5, stage:3 }, { x:694, y:162, r:3,   stage:4 },
    { x:585, y:515, r:4.5, stage:4 }, { x:162, y:324, r:3,   stage:2 }
  ] : [
    { x:60,   y:700, r:4,   stage:2 }, { x:640,  y:340, r:3.5, stage:3 },
    { x:1360, y:500, r:4,   stage:1 }, { x:490,  y:790, r:3.5, stage:2 },
    { x:1320, y:830, r:3.5, stage:3 }, { x:972,  y:90,  r:3,   stage:4 },
    { x:900,  y:580, r:4.5, stage:4 }, { x:136,  y:436, r:3,   stage:2 }
  ];

  /* ---------- cast ---------- */

  const CAST = [
    { name:'Eleven',        pic:'🧇', flavor:'A trail of Eggo crumbs runs out here. Every streetlight on the block is dead.' },
    { name:'Dustin',        pic:'🧢', flavor:'He is still in radio range, so Cerebro says he found the high ground.' },
    { name:'Max',           pic:'🛹', flavor:'She skated. It is downhill the whole way, and she never takes the long route.' },
    { name:'Will',          pic:'🔦', flavor:'He has been drawing this place all week. The green crayon is worn to a stub.' },
    { name:'Steve',         pic:'🏒', flavor:'He drove, so wherever he is, there is somewhere to park the Beemer.' },
    { name:'Vecna',         pic:'🕰️', flavor:'The clock has chimed twice. He is somewhere quiet, and he already knows where you will look.', boss:true },
    { name:'Ayan',          pic:'🎮', flavor:'They said they would be home before dinner. They were not home before dinner.' },
    { name:'Deepak',        pic:'🧭', flavor:'They only went out for five minutes, and they always take the long way round.' },
    { name:'Smriti',        pic:'🎨', flavor:'They went wherever the light is best, and have not looked up from the sketchbook since.' }
  ];

  const COMPASS = ['north','north-east','east','south-east','south','south-west','west','north-west'];
  const ARROWS  = ['⬆️','↗️','➡️','↘️','⬇️','↙️','⬅️','↖️'];

  /* ---------- deterministic daily seed ---------- */

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function hash(str){
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function mulberry32(a){
    return function(){
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- geometry, measured in blocks ---------- */

  const blocksBetween = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) / BLOCK;

  // SVG y grows downward, so north is -y.
  function bearing(from, to){
    return (Math.atan2(to.x - from.x, from.y - to.y) * 180 / Math.PI + 360) % 360;
  }

  const octant = deg => Math.round(deg / 45) % 8;

  /* ---------- puzzle ---------- */

  const key = todayKey();
  // The Town is the reference point, never the hiding place.
  const HIDEABLE = PLACES.filter(function(p){ return p.id !== 'town'; });

  // Round 0 is the daily everyone shares. "New hunt" walks the rounds forward
  // from there, so the seed stays reproducible instead of going random.
  function puzzleFor(round){
    const rnd = mulberry32(hash('findr::town::' + key + (round ? '#' + round : '')));
    return {
      cast:  CAST[Math.floor(rnd() * CAST.length)],
      place: HIDEABLE[Math.floor(rnd() * HIDEABLE.length)]
    };
  }

  let round = 0, puzzle, MAX_GUESSES, trueBearing, trueBlocks;

  function setRound(r){
    round = r;
    puzzle = puzzleFor(r);
    // Vecna takes a guess off you just by being the one you are hunting.
    MAX_GUESSES = puzzle.cast.boss ? 4 : 5;
    trueBearing = bearing(TOWN, puzzle.place);
    trueBlocks  = blocksBetween(TOWN, puzzle.place);
  }

  // Walk forward to the next round that changes both the person and the place,
  // so a reset never feels like it did nothing.
  function nextRound(){
    const wasCast = puzzle.cast.name, wasPlace = puzzle.place.id;
    for (let r = round + 1; r <= round + 60; r++){
      const cand = puzzleFor(r);
      if (cand.cast.name !== wasCast && cand.place.id !== wasPlace) return r;
    }
    return round + 1;   // unreachable in practice, but never loop forever
  }

  // "3.5 blocks from the green" meant nothing to anyone. Directions are now a
  // landmark everyone can see plus a beam of light drawn on the map; distances
  // are a walk time plus a glowing ring. One block is about a two-minute walk.
  const walkMin = b => Math.max(1, Math.round(b * 2));

  // the farthest place out in the same direction — "they went that way"
  function beaconFor(deg){
    const oct = octant(deg);
    let best = null, bestD = -1;
    HIDEABLE.forEach(function(p){
      if (p.id === puzzle.place.id) return;
      if (octant(bearing(TOWN, p)) !== oct) return;
      const d = blocksBetween(TOWN, p);
      if (d > bestD){ bestD = d; best = p; }
    });
    return best;
  }

  function clueList(){
    const lo = Math.floor(trueBlocks * 2) / 2;
    const bcn = beaconFor(trueBearing);
    const dir = bcn ? 'out the <b>' + bcn.pic + ' ' + bcn.name + '</b> way'
                    : 'toward the <b>' + COMPASS[octant(trueBearing)] + '</b> edge of town';
    const mins = lo === 0 ? 'barely a <b>minute\u2019s walk</b>'
               : 'a <b>' + (lo * 2) + ' to ' + ((lo + 0.5) * 2) + ' minute walk</b>';
    return [
      puzzle.cast.flavor,
      'They went ' + dir + ' — follow the beam of light on the map.',
      'It is ' + mins + ' from The Town — search along the glowing ring.',
      'They picked it because <b>' + puzzle.place.hint + '</b>.'
    ];
  }

  /* ---------- state ---------- */

  let selected = null, guesses = [], done = false;
  const el = id => document.getElementById(id);
  const svg = el('map');
  const SVGNS = 'http://www.w3.org/2000/svg';

  const saveKey  = () => 'findr::town::' + key + (round ? '#' + round : '');
  const ROUND_KEY = 'findr::town::round::' + key;

  function save(){
    try {
      localStorage.setItem(saveKey(), JSON.stringify({ guesses, done }));
      localStorage.setItem(ROUND_KEY, String(round));
    } catch(e){ /* private mode — just don't persist */ }
  }
  function load(){
    try { return JSON.parse(localStorage.getItem(saveKey()) || 'null'); }
    catch(e){ return null; }
  }
  function loadRound(){
    try {
      const r = parseInt(localStorage.getItem(ROUND_KEY) || '0', 10);
      return isFinite(r) && r >= 0 ? r : 0;
    } catch(e){ return 0; }
  }

  /* ---------- drawing the map ---------- */

  function node(tag, attrs, text){
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function drawMap(){
    // a touch of turbulence so the ground looks drawn by hand
    const defs = node('defs', {});
    const wob = node('filter', { id:'wobble', x:'-5%', y:'-5%', width:'110%', height:'110%' });
    wob.appendChild(node('feTurbulence', { type:'fractalNoise', baseFrequency:'0.013', numOctaves:'2', seed:'7', result:'n' }));
    wob.appendChild(node('feDisplacementMap', { in:'SourceGraphic', in2:'n', scale:'7' }));
    defs.appendChild(wob);
    const glow = node('radialGradient', { id:'beamGrad', gradientUnits:'userSpaceOnUse', cx:TOWN.x, cy:TOWN.y, r:900 });
    [['0%','#ffd76a','0.5'], ['55%','#ffce4d','0.26'], ['100%','#f7bd35','0.07']].forEach(function(st){
      glow.appendChild(node('stop', { offset:st[0], 'stop-color':st[1], 'stop-opacity':st[2] }));
    });
    defs.appendChild(glow);
    const soften = node('filter', { id:'soften', x:'-30%', y:'-30%', width:'160%', height:'160%' });
    soften.appendChild(node('feGaussianBlur', { stdDeviation:'7' }));
    defs.appendChild(soften);
    svg.appendChild(defs);

    // The Town wobbles like a hand drawing; the City grid is drawn dead
    // straight. Either way: asphalt/paper first, everything else on top.
    const ground = node('g', CITY ? {} : { filter:'url(#wobble)' });
    svg.appendChild(ground);

    if (!CITY){
      TOWN_BLOCKS.forEach(function(b){ ground.appendChild(node('polygon', { points:b.points, class:'blk ' + b.tone })); });
      ground.appendChild(node('polygon', { points:TOWN_LAKE, class:'lake' }));
      // the railway runs east to west, just above Depot St
      ground.appendChild(node('line', { x1:-700, y1:286, x2:1700, y2:286, class:'rail' }));
      TOWN_STREETS.forEach(function(s){
        ground.appendChild(node('line', {
          x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, class:'street ' + (s.major ? 'major' : 'minor')
        }));
        if (s.major) ground.appendChild(node('line', { x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2, class:'cline' }));
      });
      TOWN_STREETS.forEach(function(s){
        const horiz = Math.abs(s.y2 - s.y1) < Math.abs(s.x2 - s.x1);
        const lx = Math.min(s.x1 + 9, 934);   // keep the Parkway's name inside the crop
        ground.appendChild(node('text', {
          class:'streetname',
          x: horiz ? 84 : lx,
          y: horiz ? s.y1 - 9 : 96,
          transform: horiz ? '' : 'rotate(90 ' + lx + ' 96)'
        }, s.name));
      });
      // a sun for the corner of the drawing (it goes out in the Upside Down)
      const sun = node('g', { class:'sun' });
      sun.appendChild(node('circle', { cx:118, cy:112, r:28, class:'sun-disc' }));
      for (let i = 0; i < 8; i++){
        const a = i * Math.PI / 4;
        sun.appendChild(node('line', {
          x1: 118 + Math.cos(a) * 38, y1: 112 + Math.sin(a) * 38,
          x2: 118 + Math.cos(a) * 52, y2: 112 + Math.sin(a) * 52, class:'sun-ray'
        }));
      }
      sun.appendChild(node('circle', { cx:108, cy:106, r:3, class:'sun-eye' }));
      sun.appendChild(node('circle', { cx:128, cy:106, r:3, class:'sun-eye' }));
      sun.appendChild(node('path', { d:'M106,119 Q118,130 130,119', class:'sun-mouth' }));
      ground.appendChild(sun);
    }

    if (CITY){
    // One fixed seed, so the city's wear and its coastline are the same every
    // time it is drawn — a new hunt should not repave the streets.
    const rnd = mulberry32(0x51ce);

    // The island's edge is not a ruler line: it is nibbled all the way round,
    // and a pier sticks out into the water on each side. Its outline is kept
    // as a clip, since Broadway has to stop at the water like everything else.
    const isle = (function(){
      const pts = [];
      const push = (x, y) => pts.push(x.toFixed(1) + ',' + y.toFixed(1));
      // each edge as [x1,y1,x2,y2, outward normal], walked clockwise
      [[SLAB.x0, SLAB.y0, SLAB.x1, SLAB.y0,  0, -1],
       [SLAB.x1, SLAB.y0, SLAB.x1, SLAB.y1,  1,  0],
       [SLAB.x1, SLAB.y1, SLAB.x0, SLAB.y1,  0,  1],
       [SLAB.x0, SLAB.y1, SLAB.x0, SLAB.y0, -1,  0]].forEach(function(e){
        const len = Math.hypot(e[2] - e[0], e[3] - e[1]);
        const n = Math.max(8, Math.round(len / 85));
        const ux = (e[2] - e[0]) / len, uy = (e[3] - e[1]) / len;
        const pier = 2 + Math.floor(rnd() * (n - 4));
        for (let i = 0; i < n; i++){
          const t = i / n;
          const x = e[0] + (e[2] - e[0]) * t, y = e[1] + (e[3] - e[1]) * t;
          const d = rnd() * 15 - 11;                  // mostly nibbled inward
          push(x + e[4] * d, y + e[5] * d);
          if (i === pier){                            // out into the water and back
            const o = 44;
            push(x + e[4] * o + ux * 7,  y + e[5] * o + uy * 7);
            push(x + e[4] * o + ux * 31, y + e[5] * o + uy * 31);
            push(x + e[4] * d + ux * 38, y + e[5] * d + uy * 38);
          }
        }
      });
      const shape = pts.join(' ');
      ground.appendChild(node('polygon', { points:shape, class:'asphalt' }));
      const clip = node('clipPath', { id:'isle' });
      clip.appendChild(node('polygon', { points:shape }));
      ground.appendChild(clip);
      return clip;                       // the bridges get added to it below
    })();

    // Paint wears. Every marking is laid down in a few runs, some fainter
    // than others, and now and then a stretch has gone altogether.
    function worn(x1, y1, x2, y2, cls, into, n){
      const runs = n || 5 + Math.floor(rnd() * 3);
      for (let i = 0; i < runs; i++){
        if (rnd() < 0.13) continue;
        const a = i / runs, b = (i + 1) / runs;
        (into || ground).appendChild(node('line', {
          x1:(x1 + (x2 - x1) * a).toFixed(1), y1:(y1 + (y2 - y1) * a).toFixed(1),
          x2:(x1 + (x2 - x1) * b).toFixed(1), y2:(y1 + (y2 - y1) * b).toFixed(1),
          class:cls, opacity:(0.5 + rnd() * 0.5).toFixed(2)
        }));
      }
    }

    // Lane markings follow the kinks: each road is painted segment by
    // segment, so a line that bends at an intersection bends with it.
    AVX.forEach(function(ax, i){
      const L = aveLine(i);
      const run = [{ x:L[0].x, y:SLAB.y0 + 20 }]
        .concat(L.map(function(p){ return { x:p.x, y:p.y }; }),
                [{ x:L[L.length-1].x, y:SLAB.y1 - 20 }]);
      for (let k = 1; k < run.length; k++){
        [-3, 3].forEach(function(o){
          worn(run[k-1].x + o, run[k-1].y, run[k].x + o, run[k].y, 'lane-y', null, 3);
        });
      }
    });
    STY.forEach(function(sy, j){
      const L = stLine(j);
      const run = [{ x:SLAB.x0 + 20, y:L[0].y }]
        .concat(L.map(function(p){ return { x:p.x, y:p.y }; }),
                [{ x:SLAB.x1 - 20, y:L[L.length-1].y }]);
      for (let k = 1; k < run.length; k++){
        worn(run[k-1].x, run[k-1].y, run[k].x, run[k].y, 'lane-w', null, 3);
      }
    });

    // The blocks: a sidewalk apron with the lot coloured in on top of it. No
    // two are quite the same shape, since no two corners line up. The park
    // keeps its lawn; everyone else gets one of the old crayons.
    const LOTS = [];
    for (let c = 0; c < AVX.length - 1; c++){
      for (let r = 0; r < STY.length - 1; r++){
        const quad = blockQuad(c, r);
        ground.appendChild(node('path', { d:roundPoly(quad, 10), class:'sidewalk' }));
        const lot = inset(quad, 19);
        const park = c === PARK.col && r === PARK.row;
        ground.appendChild(node('path', {
          d:roundPoly(lot, 6), class: park ? 'lawn' : 'lot b' + ((c*3 + r*5) % 9)
        }));
        LOTS[c * 9 + r] = { quad:quad, lot:lot };
      }
    }

    // Zebra crossings on all four sides of every intersection. Each one is
    // worn on its own: a little faded, and some have lost an end stripe.
    NODE.forEach(function(col, i){ col.forEach(function(p, j){
      const ax = p.x, sy = p.y, aw = AVW[i] / 2, sw = STW[j] / 2;
      [[ax-aw, sy-sw-6, ax+aw, sy-sw-6],
       [ax-aw, sy+sw+6, ax+aw, sy+sw+6],
       [ax-aw-6, sy-sw, ax-aw-6, sy+sw],
       [ax+aw+6, sy-sw, ax+aw+6, sy+sw]].forEach(function(w){
        const eat = rnd() < 0.3 ? 0.12 + rnd() * 0.2 : 0;   // a stripe gone from one end
        ground.appendChild(node('line', {
          x1:w[0] + (w[2] - w[0]) * eat, y1:w[1] + (w[3] - w[1]) * eat, x2:w[2], y2:w[3],
          class:'xwalk', opacity:(0.6 + rnd() * 0.4).toFixed(2)
        }));
      });
    }); });

    // Street names painted on the asphalt, avenue names running along them.
    // The stencils are laid by hand, so none of them is quite square.
    STY.forEach(function(sy, j){
      const ly = stYAt(j, 170) + 4.5;
      ground.appendChild(node('text', {
        class:'streetname', x:170, y:ly.toFixed(1), opacity:(0.65 + rnd() * 0.3).toFixed(2),
        transform:'rotate(' + (rnd() * 3 - 1.5).toFixed(2) + ' 170 ' + ly.toFixed(1) + ')'
      }, ST_NAMES[j]));
    });
    AVX.forEach(function(ax, i){
      const lx = avXAt(i, 346);
      ground.appendChild(node('text', {
        class:'streetname', x:lx.toFixed(1), y:346, 'text-anchor':'middle',
        opacity:(0.65 + rnd() * 0.3).toFixed(2),
        transform:'rotate(' + (-90 + rnd() * 3 - 1.5).toFixed(2) + ' ' + lx.toFixed(1) + ' 346)'
      }, AVE_NAMES[i]));
    });

    // Broadway, laid over the blocks it cuts: sidewalk apron, then asphalt.
    // The wedge lots and the slivers at the avenues are simply what is left
    // of the square blocks underneath.
    (function(){
      const bw = node('g', { 'clip-path':'url(#isle)' });   // it stops at the water
      ground.appendChild(bw);
      const L = Math.hypot(BWAY.x1 - BWAY.x0, BWAY.y1 - BWAY.y0);
      const px = (BWAY.y1 - BWAY.y0) / L, py = -(BWAY.x1 - BWAY.x0) / L;   // across it
      bw.appendChild(node('line', {
        x1:BWAY.x0, y1:BWAY.y0, x2:BWAY.x1, y2:BWAY.y1,
        class:'bway-walk', 'stroke-width':BWAY_W + 26
      }));
      bw.appendChild(node('line', {
        x1:BWAY.x0, y1:BWAY.y0, x2:BWAY.x1, y2:BWAY.y1,
        class:'bway-road', 'stroke-width':BWAY_W
      }));
      [-3, 3].forEach(function(o){
        worn(BWAY.x0 + px*o, BWAY.y0 + py*o, BWAY.x1 + px*o, BWAY.y1 + py*o, 'lane-y', bw);
      });
      // its name runs along it, at the angle it runs
      const ang = Math.atan2(BWAY.y1 - BWAY.y0, BWAY.x1 - BWAY.x0) * 180 / Math.PI + 180;
      const lx = bwayX(250), ly = 250;
      bw.appendChild(node('text', {
        class:'streetname', x:lx, y:ly, 'text-anchor':'middle', opacity:.9,
        transform:'rotate(' + ang.toFixed(1) + ' ' + lx.toFixed(1) + ' ' + ly + ')'
      }, 'Broadway'));
    })();

    // Where Broadway cuts an avenue it leaves a sliver, and the city planted a
    // triangle of grass on the biggest one and called it a square. It is cut
    // from the lot it sits on, so it follows that block wherever it landed.
    (function(){
      const lot = LOTS[2 * 9 + 1].lot;                       // the block Broadway halves
      const tr = lot[1], br = lot[2];
      const apex = { x:tr.x, y:tr.y + (br.y - tr.y) * 0.24 };
      const base = br.y - 6;
      // the base stops well clear of Broadway's apron
      const bl = { x:Math.max(bwayX(base) + 62, br.x - 108), y:base };
      ground.appendChild(node('polygon', {
        points:[apex.x, apex.y, br.x, base, bl.x, base].map(function(v){ return v.toFixed(1); }).join(' '),
        class:'sqlawn'
      }));
      const cx = (apex.x + br.x + bl.x) / 3, cy = (apex.y + base + base) / 3;
      ground.appendChild(node('text', { x:cx.toFixed(1), y:(cy + 14).toFixed(1), class:'sqname' }, 'Herald Sq'));
      [[15,-46,17],[5,-14,16]].forEach(function(t){
        ground.appendChild(node('text', {
          x:(cx + t[0]).toFixed(1), y:(cy + t[1]).toFixed(1), 'font-size':t[2], class:'scene'
        }, '🌳'));
      });
    })();

    // Manhattan is an island: the grid floats in the river, 55th St runs out
    // over a suspension bridge on each side, and the el crosses on its own
    // trestle. A wide screen sees the water; a phone sees it above and below.
    [[SLAB.x0-620, SLAB.x0+12, NODE[0][2].y], [SLAB.x1-12, SLAB.x1+620, NODE[5][2].y]]
      .forEach(function(bx){
        const mid = (bx[0] + bx[1]) / 2, by = bx[2], w = STW[2];
        ground.appendChild(node('rect', { x:bx[0], y:by-w/2, width:bx[1]-bx[0], height:w, class:'asphalt' }));
        // a cab leaving town on 55th drives the bridge rather than the water
        isle.appendChild(node('rect', { x:bx[0], y:by-w/2, width:bx[1]-bx[0], height:w }));
        ground.appendChild(node('line', { x1:bx[0], y1:by, x2:bx[1], y2:by, class:'lane-w', opacity:.8 }));
        ground.appendChild(node('path', {
          d:'M'+bx[0]+','+(by-78)+' Q'+mid+','+(by+4)+' '+bx[1]+','+(by-78), class:'cable'
        }));
        [bx[0]+110, bx[1]-110].forEach(function(tx){
          ground.appendChild(node('rect', { x:tx-4, y:by-88, width:8, height:88, class:'btower' }));
        });
        ground.appendChild(node('rect', { x:bx[0], y:-44, width:bx[1]-bx[0], height:16, class:'bdeck' }));
      });

    // the elevated line skirts the top of the grid, above 59th
    ground.appendChild(node('line', { x1:SLAB.x0-620, y1:-36, x2:SLAB.x1+620, y2:-36, class:'rail' }));

    // the park itself: pond, two paths that meet at the gazebo, and shade
    ground.appendChild(node('ellipse', { cx:735, cy:640, rx:30, ry:15, class:'pond' }));
    ground.appendChild(node('path', { d:'M668,482 Q800,575 932,668', class:'ppath' }));
    ground.appendChild(node('path', { d:'M932,482 Q800,575 668,668', class:'ppath' }));

  /* ---------- admin: drag the town into shape ----------

  const ADMIN = /[?&]admin\b/.test(location.search);
  const ADMIN_KEY = 'findr::admin::places::' + MAPMODE;   // each map keeps its own edits
  let adminDragging = null, adminPicked = null;
  const adminGone = new Set();

  function adminSetRemoved(id, gone){
    if (gone) adminGone.add(id); else adminGone.delete(id);
    const g = gfx(id);
    if (g) g.classList.toggle('removed', gone);

  function adminSelect(id){
    adminPicked = id;
    PLACES.forEach(function(q){ const n = gfx(q.id); if (n) n.classList.toggle('picked', q.id === id); });

  function loadAdminMoves(){
    if (!ADMIN) return;
    try {
      const saved = JSON.parse(localStorage.getItem(ADMIN_KEY) || '{}');
      const pos = saved.pos || saved;                    // older saves were flat
      PLACES.forEach(function(p){
        if (pos[p.id]){ p.x = pos[p.id][0]; p.y = pos[p.id][1]; }
      });
      (saved.gone || []).forEach(function(id){ adminGone.add(id); });
      recomputeBounds();
    } catch(e){}
  }

  function saveAdminMoves(){
    const out = { pos:{}, gone:[...adminGone] };
    PLACES.forEach(function(p){ out.pos[p.id] = [Math.round(p.x), Math.round(p.y)]; });
    try { localStorage.setItem(ADMIN_KEY, JSON.stringify(out)); } catch(e){}
  }

  // the same rule the map is judged by: markers, labels, and labels on markers
  const hit = (a, b) => Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left)) *
                        Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));

  function adminOverlaps(){
    const rects = PLACES.map(function(p){
      const g = gfx(p.id);
      const art = g.querySelector('.art') || g.querySelector('.dot');
      // Some places are drawn without a name (noLabel), so there may be
      // nothing to measure for the label checks.
      const lab = g.querySelector('.label');
      return { id:p.id, art:art.getBoundingClientRect(), lab:lab ? lab.getBoundingClientRect() : null };
    });
    const bad = [];
    // A place under a floating panel cannot be clicked at all, which is the
    // same problem as one marker sitting on another.
    ['.panel-scroll', '.panel-foot'].forEach(function(sel){
      const box = document.querySelector(sel);
      if (!box || !box.offsetParent) return;
      const pr = box.getBoundingClientRect();
      rects.forEach(function(R){
        if (hit(R.art, pr) > 20) bad.push(R.id + ' under the panel');
      });
    });
    for (let i = 0; i < rects.length; i++){
      for (let j = i + 1; j < rects.length; j++){
        const A = rects[i], B = rects[j];
        if (hit(A.art, B.art) > 4)  bad.push(A.id + ' x ' + B.id);
        if (A.lab && B.lab && hit(A.lab, B.lab) > 4)  bad.push(A.id + ' label x ' + B.id + ' label');
        if (B.lab && hit(A.art, B.lab) > 30) bad.push(B.id + ' label over ' + A.id);
        if (A.lab && hit(B.art, A.lab) > 30) bad.push(A.id + ' label over ' + B.id);
      }
    }
    return bad;
  }

  function adminReport(){
    if (!ADMIN) return;

    const tag = el('aOverlap');

    tag.textContent = bad.length
      ? '\u26a0 ' + bad.length + ' overlap' + (bad.length > 1 ? 's' : '') + ': ' + bad.slice(0, 2).join(', ')
      : '\u2713 nothing overlaps';

    const pickedPlace = adminPicked && byId(adminPicked);
    el('aPick').textContent = pickedPlace
      ? 'Selected: ' + pickedPlace.name + (adminGone.has(adminPicked) ? ' (removed)' : '')
      : 'Nothing selected';
    el('aRemove').disabled = !adminPicked;
    el('aRemove').textContent = adminPicked && adminGone.has(adminPicked) ? 'Restore' : 'Remove';

    const kept = PLACES.filter(function(p){ return !adminGone.has(p.id); });
    el('aOut').value =
      kept.map(function(p){
        return "{ id:'" + p.id + "', x:" + Math.round(p.x) + ", y:" + Math.round(p.y) + " },";

      (adminGone.size ? '\n// removed: ' + [...adminGone].join(', ') : '');

  // markers are drawn at their original spot and shifted, so a move is one attribute
  function placeMarker(p){
    const g = gfx(p.id);
    if (g) g.setAttribute('transform', 'translate(' + (p.x - p.ox) + ',' + (p.y - p.oy) + ')');
  }

  function adminDraggable(g, p){
    g.addEventListener('pointerdown', function(e){
      e.stopPropagation();                 // the map must not pan underneath
      adminSelect(p.id);
      adminDragging = p;
      g.classList.add('dragging');
      try { g.setPointerCapture(e.pointerId); } catch(err){}
    });
    g.addEventListener('pointermove', function(e){
      if (adminDragging !== p) return;
      const m = toMap(e.clientX, e.clientY);
      p.x = Math.round(m.x);
      p.y = Math.round(m.y);
      placeMarker(p);
      suppressClick = true;                // a drag is not a tap
    });
    function done(e){
      if (adminDragging !== p) return;
      g.classList.remove('dragging');
      try { g.releasePointerCapture(e.pointerId); } catch(err){}
      adminDragging = null;
      recomputeBounds();
      applyView();
      saveAdminMoves();
      adminReport();

    g.addEventListener('pointerup', done);
    g.addEventListener('pointercancel', done);
